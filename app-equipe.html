<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Espace administrateur — Équipe EXHALESSENCE</title>

<style>
:root{--dore:#C9A96E;--r-sm:12px;--creme:#FDFAF7;--beige:#F5EDE3;--brun:#2C1810;--terra:#9E5238;--teal:#3A766E;--or:#C9A96E;--gris:#6B5E55;--bord:#3D2B2E}
*{box-sizing:border-box}
html,body{margin:0;background:var(--creme);color:var(--brun);font-family:'Lato','Segoe UI',Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100dvh;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.barre{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bord);color:#fff;padding-top:max(10px,env(safe-area-inset-top))}
.barre h1{font-size:16px;margin:0;flex:1;font-weight:700}
.barre button{background:transparent;border:1px solid rgba(255,255,255,.55);color:#fff;border-radius:20px;padding:8px 16px;font-size:14px;min-height:40px}
:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
.page{width:100%;max-width:680px;margin:0 auto;padding:16px 14px 40px}
/* verrou */
#verrou{position:fixed;inset:0;background:var(--creme);display:flex;align-items:flex-start;justify-content:center;padding:24px 18px;z-index:20;overflow:auto}
#verrou.cache{display:none}
.carte-v{width:100%;max-width:380px;text-align:center;margin-top:4vh}
.carte-v .mono{width:96px;height:96px;border-radius:50%;margin:0 auto 8px;display:block}
.carte-v h2{margin:6px 0 2px;font-size:21px}
.carte-v .sous{margin:0 0 10px;color:var(--gris);font-size:14.5px;line-height:1.5}
.carte-v label{display:block;text-align:left;font-size:13.5px;font-weight:700;margin:12px 0 4px}
.carte-v input{width:100%;padding:13px;border:1.5px solid rgba(201,169,110,.8);border-radius:14px;font-size:16px;background:#fff}
.mdp-ligne{position:relative}
.mdp-ligne button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--terra);font-weight:700;padding:10px;font-size:13.5px}
.btn{background:var(--terra);color:#fff;border:0;border-radius:26px;padding:13px 22px;font-weight:700;font-size:16px;min-height:48px}
.btn:disabled{opacity:.6}
.btn.pleine{width:100%;margin-top:16px}
.btn.sec{background:transparent;color:var(--terra);border:1.5px solid var(--terra)}
.lien{background:none;border:0;color:var(--terra);text-decoration:underline;font-size:14px;padding:10px;min-height:44px}
.err{min-height:20px;font-size:14px;color:#a3301f;margin:8px 0 0}
.ok{font-size:14px;color:#2a6a5a;margin:8px 0}
/* accueil */
.hero{text-align:center;padding:6px 0 4px}
.hero img.logo{max-width:210px;max-height:110px;object-fit:contain;display:block;margin:0 auto 8px}
.hero .ttl{font-size:23px;font-weight:700;margin:0 0 4px;letter-spacing:.3px}
.hero .nom{font-size:19px;margin:2px 0}
.hero .role{font-size:14.5px;color:var(--gris);margin:2px 0}
.hero .prod{font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--terra);margin:6px 0 0;font-weight:700}
.infos{background:var(--beige);border:1.5px solid rgba(201,169,110,.55);border-radius:18px;padding:12px 14px;margin:14px 0;text-align:center}
.infos .dt{font-size:15px;}
.infos .hr{font-size:26px;font-weight:700;margin:0}
.infos .meteo{font-size:14.5px;color:var(--gris);margin-top:4px}
.tuiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tuile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:118px;padding:12px 8px;background:var(--beige);border:1.5px solid rgba(201,169,110,.6);border-radius:20px;color:var(--brun);font-weight:700;font-size:15.5px;text-align:center}
.tuile .e{font-size:30px;line-height:1}
.tuile small{font-weight:400;font-size:12.5px;color:var(--gris)}
.tuile:active{background:#ecdfd0}
.tuile.large{grid-column:1/-1;min-height:96px}
.inst{margin-top:18px;text-align:center}
.bandeau-b{display:inline-block;background:var(--teal);color:#fff;border-radius:12px;padding:2px 10px;font-size:12.5px;margin-left:6px}
/* vues */
.retour{background:none;border:0;color:var(--terra);font-weight:700;font-size:15px;padding:10px 0;min-height:44px}
h2.vt{font-size:21px;margin:4px 0 10px}
.boite{background:#fff;border:1.5px solid rgba(201,169,110,.55);border-radius:18px;padding:13px;margin-bottom:12px}
.boite .l1{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.boite .l1 strong{font-size:16px}
.boite .l1 span{color:var(--terra);font-weight:700}
.boite .l2{font-size:13.5px;color:var(--gris);margin:3px 0;line-height:1.5}
.boite .art{font-size:13px;color:var(--gris);white-space:pre-line;line-height:1.55;margin-top:4px}
.boite .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.boite .acts a,.petit{display:inline-block;background:var(--terra);color:#fff;border:0;border-radius:20px;padding:9px 16px;font-weight:700;font-size:13.5px;text-decoration:none;min-height:40px}
.etiq{display:inline-block;border-radius:10px;padding:1px 9px;font-size:12px;font-weight:700;margin-left:6px;background:#e6efe9;color:#2a6a5a}
.etiq.ann{background:#f4dede;color:#a3301f}
.etiq.auj{background:var(--or);color:var(--brun)}
.rech{width:100%;padding:12px;border:1.5px solid rgba(201,169,110,.8);border-radius:14px;font-size:16px;background:#fff;margin-bottom:12px}
.vide{text-align:center;color:var(--gris);padding:24px 8px;line-height:1.6}
/* formulaire */
.form label{display:block;font-size:13.5px;font-weight:700;margin:10px 0 4px}
.form input,.form select,.form textarea{width:100%;padding:12px;border:1.5px solid rgba(201,169,110,.8);border-radius:12px;font-size:16px;background:#fff}
.deux{display:flex;gap:8px}.deux>div{flex:1;min-width:0}
.ligne-art{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap;margin-top:6px}
.ligne-art .a{flex:3;min-width:140px}.ligne-art .q{width:70px}.ligne-art .p{width:96px}
.ligne-art button{background:none;border:0;color:#8B2D22;text-decoration:underline;font-size:13px;padding:12px 4px}
.tot{text-align:right;font-size:17px;font-weight:700;margin:10px 0}
.tot small{display:block;font-size:13px;font-weight:400;color:var(--gris)}
.puce{display:inline-block;border:1.5px solid var(--or);border-radius:18px;padding:7px 14px;margin:4px 6px 4px 0;background:#fff;font-size:14px}
.puce.on{background:var(--terra);color:#fff;border-color:var(--terra)}
.guide-it{padding:11px 0;border-top:1px solid rgba(201,169,110,.35)}
.guide-it b{font-size:15.5px}.guide-it .f{font-size:12.5px;color:var(--terra);font-weight:700}
.guide-it .e{font-size:14px;line-height:1.5;margin-top:2px}
.aide{font-size:13.5px;color:var(--gris);line-height:1.6;background:var(--beige);border-radius:14px;padding:11px 13px;margin:10px 0}
.gd-card{background:#fff;border:1.5px solid rgba(201,169,110,.55);border-radius:18px;padding:13px;margin-bottom:12px}
.gd-card>b{font-size:18px;display:block;margin-bottom:4px}
.gd-card small{color:var(--gris)}
.btn-p{display:inline-flex;align-items:center;background:var(--terra);color:#fff;border-radius:26px;padding:12px 20px;font-weight:700;font-size:15px;min-height:46px}
@media (prefers-reduced-motion:no-preference){.tuile{transition:background .15s}}
</style>
</head>

var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function norm(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim()}
function eur(n){return (Math.round((Number(n)||0)*100)/100).toFixed(2).replace(".",",")+" €"}
function nb(v){return Number(String(v||"").replace(",","."))||0}
var Z="Europe/Paris";

/* ---------- état ---------- */
var jeton="",finSession=0,profil=null,ventes=null,cree=0,guide=null;
var MEM="eqapp-compte";
function lireCompte(){try{return JSON.parse(localStorage.getItem(MEM)||"null")}catch(e){return null}}
function ecrireCompte(o){try{localStorage.setItem(MEM,JSON.stringify(o))}catch(e){}}
function effacerCompte(){try{localStorage.removeItem(MEM)}catch(e){}}

function post(route,corps){
  corps=corps||{};if(jeton)corps.jeton=jeton;
  return fetch(API+route,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(corps)}).then(function(r){return r.json().then(function(j){j._s=r.status;return j})})
}
function estFeminin(){return !(profil&&profil.civ==="m")}

var secOeil=false;
function afficheVerrou(msg){
  var c=lireCompte();
  $("verrou").classList.remove("cache");$("appli").hidden=true;
  $("v-premiere").hidden=!!c;$("v-autre").hidden=!c;
  var b=$("v-bonjour");

  setTimeout(function(){var f=c?$("v-mdp"):$("v-prenom");try{f.focus()}catch(e){}},50);

$("v-oubli").addEventListener("click",function(){
  var c=lireCompte(),mail=c?c.mail:$("v-mail").value.trim();
  if(!mail)return($("v-err").textContent="Écrivez d'abord votre adresse e-mail (ci-dessus).");

});
$("f-login").addEventListener("submit",function(e){
  e.preventDefault();
  var c=lireCompte(),mail,prenom="",nom="";
  $("v-err").style.color="#a3301f";
  if(c){mail=c.mail}else{
    prenom=$("v-prenom").value.trim();nom=$("v-nom").value.trim();mail=$("v-mail").value.trim().toLowerCase();
    if(!prenom||!nom)return($("v-err").textContent="Merci d'écrire votre prénom et votre nom.");
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail))return($("v-err").textContent="Merci d'écrire l'adresse e-mail de votre compte.");
  }
  var mdp=$("v-mdp").value;
  if(!mdp)return($("v-err").textContent="Merci d'écrire votre mot de passe.");
  $("v-go").disabled=true;$("v-err").textContent="";
  post("/equipe/connexion",{mail:mail,mdp:mdp}).then(function(r){
    $("v-go").disabled=false;
    if(!r.ok||!r.jeton){$("v-err").textContent=r.erreur||"Connexion impossible. Réessayez.";return}
    jeton=r.jeton;profil=r.profil||{};finSession=Date.now()+55*60*1000;
    ecrireCompte({mail:profil.mail||mail,prenom:profil.prenom||prenom,nom:profil.nom||nom});
    $("v-mdp").value="";
    ouvre();
  }).catch(function(){$("v-go").disabled=false;$("v-err").textContent="Pas de connexion : réessayez dans un instant."});
});

function horloge(){

  var t=d.toLocaleDateString("fr-FR",{timeZone:Z,weekday:"long",day:"numeric",month:"long",year:"numeric"});$("h-date").textContent=t.charAt(0).toUpperCase()+t.slice(1);

}

/* météo + lieu (seulement si le téléphone l'autorise) */
var WMO=function(c){if(c===0)return["☀️","ciel dégagé"];if(c<=2)return["🌤️","peu nuageux"];if(c===3)return["☁️","couvert"];if(c===45||c===48)return["🌫️","brouillard"];if(c>=51&&c<=57)return["🌦️","bruine"];if(c>=61&&c<=67)return["🌧️","pluie"];if(c>=71&&c<=77)return["❄️","neige"];if(c>=80&&c<=82)return["🌦️","averses"];if(c>=95)return["⛈️","orage"];return["🌡️",""]};
function lieuMeteo(demande){
  var m=$("h-meteo"),b=$("h-loc");
  if(!navigator.geolocation){m.textContent="";b.hidden=true;return}
  function lance(){
    navigator.geolocation.getCurrentPosition(function(p){
      var la=p.coords.latitude,lo=p.coords.longitude;b.hidden=true;
      var q1=fetch("https://api.open-meteo.com/forecast?latitude="+la+"&longitude="+lo+"&current=temperature_2m,weather_code&timezone=auto").then(function(r){return r.json()});
      var q2=fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude="+la+"&longitude="+lo+"&localityLanguage=fr").then(function(r){return r.json()}).catch(function(){return {}});
      Promise.all([q1,q2]).then(function(a){
        var cur=a[0]&&a[0].current,ville=a[1]&&(a[1].city||a[1].locality)||"";
        if(!cur){m.textContent="";return}
        var w=WMO(cur.weather_code);
        m.textContent=w[0]+" "+Math.round(cur.temperature_2m)+" °C"+(w[1]?" · "+w[1]:"")+(ville?" · 📍 "+ville:"");
      }).catch(function(){m.textContent=""});
    },function(err){
      m.textContent="";b.hidden=false;
      b.textContent=err&&err.code===1&&demande?"Localisation refusée : autorisez-la dans les réglages du navigateur, puis touchez ici":"Afficher la météo et ma ville";
    },{timeout:12000,maximumAge:600000});
  }
  if(navigator.permissions&&navigator.permissions.query){
    navigator.permissions.query({name:"geolocation"}).then(function(s){
      if(s.state==="granted"||demande)lance();
      else if(s.state==="denied"){m.textContent="";b.hidden=false;b.textContent="Afficher la météo et ma ville"}
      else{m.textContent="";b.hidden=false}
    }).catch(function(){if(demande)lance();else b.hidden=false});
  }else{if(demande)lance();else b.hidden=false}
}
$("h-loc").addEventListener("click",function(){lieuMeteo(true)});

function chargeVentes(cb,forcer){

function prochainAnniv(naiss){
  var m=String(naiss||"").match(/^(\d{1,2})[\/\-. ](\d{1,2})[\/\-. ](\d{4})$/);if(!m)return null;
  var j=+m[1],mo=+m[2],an=+m[3];if(j<1||j>31||mo<1||mo>12)return null;
  var nowP=new Date(new Date().toLocaleString("en-US",{timeZone:Z}));
  var auj=new Date(nowP.getFullYear(),nowP.getMonth(),nowP.getDate());
  var d=new Date(auj.getFullYear(),mo-1,j);
  if(d<auj)d=new Date(auj.getFullYear()+1,mo-1,j);
  return {jours:Math.round((d-auj)/864e5),date:d,age:d.getFullYear()-an};
}

/* Mon site internet */
function lienPerso(equipe){
  var p=profil||{},a=[];
  function ad(k,v){if(v)a.push(k+"="+encodeURIComponent(v))}
  ad("p",p.prenom);ad("n",p.nom);ad("g",p.civ==="m"?"m":"f");ad("c",p.tel);ad("e",p.mail);ad("d",p.depuis);ad("a",p.apropos);ad("r",p.parr);ad("i",p.id);
  if(equipe)a.push("equipe=1");
  return PAGE+(a.length?"?"+a.join("&"):"");
}

/* Guide olfactif */
function b64(x){var t=atob(x),u=new Uint8Array(t.length);for(var i=0;i<t.length;i++)u[i]=t.charCodeAt(i);return u}
function ouvrirGuide(){
  return post("/equipe/cle",{}).then(function(r){
    if(r._s===401){verrouille("Session expirée : entrez à nouveau votre mot de passe.");return Promise.reject("401")}
    if(!r.ok||!r.cle)return Promise.reject("cle");
    return fetch("guide-app.enc.json",{cache:"no-store"}).then(function(x){return x.json()}).then(function(j){
      return crypto.subtle.importKey("raw",new TextEncoder().encode(r.cle),"PBKDF2",false,["deriveKey"]).then(function(k0){
        return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(j.salt),iterations:j.iter,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"])
      }).then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(j.iv)},k,b64(j.data))});
    });
  }).then(function(buf){var o=JSON.parse(new TextDecoder().decode(buf));return o.eq||[]});
}
VUES.guide=function(el){
  function nomRef(r){return NOMS[r]?r+" — "+NOMS[r]:"Réf. "+r}
  function affiche(){
    el.innerHTML='<h2 class="vt">Guide olfactif</h2><p class="l2">Tapez un parfum ou une référence pour trouver la correspondance. Merci de ne pas communiquer ces informations aux client(e)s.</p><input class="rech" id="g-q" type="search" placeholder="Ex. 200, Invictus, boisé…" aria-label="Chercher un parfum"><div id="g-chips"></div><p class="l2" id="g-n" style="color:#6B5E55"></p><div id="g-l"></div>';
    var genres=[],sel="";
    guide.forEach(function(g){if(g.g&&genres.indexOf(g.g)<0)genres.push(g.g)});
    $("g-chips").innerHTML='<button type="button" class="puce on" data-g="">Tous</button>'+genres.map(function(g){return '<button type="button" class="puce" data-g="'+esc(g)+'">'+esc(g)+'</button>'}).join("");
    function dessine(){
      var q=norm($("g-q").value),h="",n=0;
      guide.forEach(function(g){
        if(sel&&g.g!==sel)return;
        var nom=nomRef(g.ref),ligne=norm(nom+" "+g.fam+" "+(g.eq||[]).join(" ")+" "+(g.note||""));
        if(q&&ligne.indexOf(q)<0)return;
        n++;if(n>150)return;
        h+='<div class="guide-it"><b>'+esc(nom)+'</b><div class="f">'+esc([g.g,g.fam].filter(Boolean).join(" · "))+'</div><div class="e">'+esc((g.eq||[]).join(" · "))+'</div>'+(g.note?'<div class="l2">'+esc(g.note)+'</div>':'')+'</div>';
      });
      $("g-n").textContent=n+" résultat"+(n>1?"s":"");
      $("g-l").innerHTML=h||'<p class="vide">Aucun résultat.</p>';
    }
    $("g-q").addEventListener("input",dessine);
    $("g-chips").addEventListener("click",function(e){var b=e.target.closest(".puce");if(!b)return;sel=b.getAttribute("data-g");[].forEach.call($("g-chips").children,function(x){x.classList.toggle("on",x===b)});dessine()});
    dessine();
  }
  if(guide)return affiche();
  el.innerHTML='<h2 class="vt">Guide olfactif</h2><p class="vide">Chargement…</p>';
  ouvrirGuide().then(function(g){guide=g;affiche()}).catch(function(e){if(e==="401")return;el.innerHTML='<h2 class="vt">Guide olfactif</h2><p class="vide">Le guide n\'a pas pu s\'ouvrir. Vérifiez votre connexion et réessayez.</p>'});
};
