    L.sort(function(a,b){return a.pa.jours-b.pa.jours});
    var sans=clients().filter(function(c){return !c.pa}).length;
    if(!L.length){$("a-z").innerHTML='<p class="vide">Aucun anniversaire à afficher.<br>Ils apparaissent quand la date de naissance est écrite dans le bon de commande (par exemple 05/03/1980).</p>';return}
    var h="";
    L.forEach(function(c){

      if(!r.ok)return msg("f-msg",r.erreur||"L'enregistrement n'a pas fonctionné. Réessayez.",1);
      ventes=null;msg("f-msg","Client(e) enregistré(e). Vous le ou la retrouvez dans « Mes clients ».");$("f-save").hidden=true;$("f-new").hidden=false;
    }).catch(function(){$("f-save").disabled=false;msg("f-msg","Pas de connexion : rien n'est enregistré. Réessayez.",1)});
  });
};

/* Mon site internet */
function lienPerso(equipe){
  var p=profil||{},a=[];
  function ad(k,v){if(v)a.push(k+"="+encodeURIComponent(v))}
  ad("p",p.prenom);ad("n",p.nom);ad("g",p.civ==="m"?"m":"f");ad("c",p.tel);ad("e",p.mail);ad("d",p.depuis);ad("a",p.apropos);ad("r",p.parr);ad("i",p.id);
  if(equipe)a.push("equipe=1");
  return PAGE+(a.length?"?"+a.join("&"):"");
}
VUES.site=function(el){
  var lc=lienPerso(false);
  el.innerHTML='<h2 class="vt">Mon site internet</h2>'+
  '<p class="l2">C\'est la page que vous avez créée sur la page équipe (votre photo, votre petit mot, vos réseaux, vos offres).</p>'+
  '<a class="btn pleine" style="display:block;text-align:center;text-decoration:none" href="'+esc(lienPerso(true))+'" target="_blank" rel="noopener">Ouvrir ma page et la modifier</a>'+
  '<p class="aide">Pour modifier votre page, identifiez-vous avec votre e-mail et votre mot de passe (c\'est la règle de sécurité de la page).</p>'+
  '<div class="boite"><strong>Mon lien à donner à mes client(e)s</strong><div class="l2" style="word-break:break-all;font-size:12px" id="s-lien"></div><div class="acts"><button class="petit" id="s-copie" type="button">Copier mon lien</button><button class="petit" id="s-part" type="button" hidden>Partager</button></div><p class="ok" id="s-msg" role="status"></p><p class="l2">N\'oubliez pas de donner aussi le code client(e).</p></div>';

/* Guide olfactif */
function b64(x){var t=atob(x),u=new Uint8Array(t.length);for(var i=0;i<t.length;i++)u[i]=t.charCodeAt(i);return u}
function ouvrirGuide(){
  return post("/equipe/cle",{}).then(function(r){
    if(r._s===401){verrouille("Session expirée : entrez à nouveau votre mot de passe.");return Promise.reject("401")}
    if(!r.ok||!r.cle)return Promise.reject("cle");
    return fetch("guide-app.enc.json",{cache:"no-store"}).then(function(x){return x.json()}).then(function(j){
      return crypto.subtle.importKey("raw",new TextEncoder().encode(r.cle),"PBKDF2",false,["deriveKey"]).then(function(k0){
        return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(j.salt),iterations:j.iter,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"])
      }).then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(j.iv)},k,b64(j.data))});
    });
  }).then(function(buf){var o=JSON.parse(new TextDecoder().decode(buf));return o.eq||[]});
}
VUES.guide=function(el){
  function normS(e){return(e=String(e||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim()).replace(/\b1 million\b/g,"one million")}
  function matchS(e,t){return t.split(" ").every(function(t){return/^\d+$/.test(t)?new RegExp("(^| )"+t+"( |$)").test(e):e.indexOf(t)>=0})}
  function affiche(){
    el.innerHTML='<h2 class="vt">Guide olfactif</h2><p class="l2">Espace réservé aux conseillers(ères) de l\'équipe : tapez un parfum ou une référence pour trouver la correspondance. Merci de ne pas communiquer ces informations aux clients.</p><label for="gd-q" style="display:block;font-weight:700;margin:12px 0 6px;font-size:14px">Rechercher une référence ou un parfum</label><input class="rech" id="gd-q" type="search" placeholder="Ex. : La vie est belle, 1 million, réf 100…" autocomplete="off" style="margin-bottom:6px"><p id="gd-n" aria-live="polite" style="font-size:13px;color:var(--gris);margin:8px 0"></p><div id="gd-res"></div>';
    guide.forEach(function(e){e.nm=NOMS[e.ref]||"";e.txt=normS("ref "+e.ref+" "+e.nm+" "+(e.eq||[]).join(" ")+" "+(e.fam||"")+" "+(e.g||"")+" "+(function(f){return f?[f.t,f.h,f.d,f.n].filter(Boolean).join(" "):""})(FICHES[e.ref]))});
    function dessine(){
      var q=normS($("gd-q").value),t=$("gd-res"),n=$("gd-n");t.textContent="";
      if(q.length<2){n.textContent="Tapez au moins 2 lettres, ou une référence (ex. 100).";return}
      var a=guide.filter(function(x){return matchS(x.txt,q)});
      n.textContent=a.length?a.length+" référence"+(a.length>1?"s":""):"Aucun résultat.";
      a.slice(0,80).forEach(function(e){
        var c=document.createElement("div");c.className="gd-card";
        var r=document.createElement("b");r.style.fontSize="18px";r.textContent="Réf. "+e.ref+(e.nm?" · "+e.nm:"");c.appendChild(r);
        var sm=document.createElement("small");sm.textContent=[e.g,e.fam,e.note].filter(Boolean).join(" · ");c.appendChild(sm);
        var u=document.createElement("ul");u.style.cssText="margin:6px 0 0;padding-left:18px;font-size:14px;line-height:1.7;color:var(--brun)";
        (e.eq||[]).forEach(function(x){var li=document.createElement("li");li.textContent=x;u.appendChild(li)});c.appendChild(u);
        var f=FICHES[e.ref];
        if(f){var w=document.createElement("div");w.style.cssText="margin-top:10px;padding-top:8px;border-top:1px solid rgba(201,162,91,.45);font-size:14px;line-height:1.7;color:var(--brun)";
          var lg=function(l,v){if(!v)return;var p=document.createElement("p");p.style.margin="2px 0";var b=document.createElement("b");b.style.color="var(--terra)";b.textContent=l+" : ";p.appendChild(b);p.appendChild(document.createTextNode(v));w.appendChild(p)};
          lg("Famille olfactive",f.f?f.f.charAt(0).toUpperCase()+f.f.slice(1).toLowerCase():"");if(f.t||f.h||f.d){lg("Tête",f.t);lg("Cœur",f.h);lg("Fond",f.d)}else lg("Notes",f.n);
          if(f.x){var q=document.createElement("p");q.style.cssText="margin:6px 0 0;font-style:italic;color:var(--gris)";q.textContent=f.x;w.appendChild(q)}
          c.appendChild(w)}
        t.appendChild(c);
      });
    }
    $("gd-q").addEventListener("input",dessine);dessine();
  }
  if(guide)return affiche();
  el.innerHTML='<h2 class="vt">Guide olfactif</h2><p class="vide">Chargement…</p>';
  ouvrirGuide().then(function(g){guide=g;affiche()}).catch(function(e){if(e==="401")return;el.innerHTML='<h2 class="vt">Guide olfactif</h2><p class="vide">Le guide n\'a pas pu s\'ouvrir. Vérifiez votre connexion et réessayez.</p>'});
};

afficheVerrou("");
