<html lang="fr">
<head>

<style>
:root{--dore:#C9A25B;--r-sm:12px;--creme:#FFFAF8;--beige:#FBF1EC;--brun:#46132F;--terra:#A1244B;--teal:#3A766E;--or:#C9A25B;--gris:#6A5360;--bord:#46132F}
*{box-sizing:border-box}
html,body{margin:0;background:var(--creme);color:var(--brun);font-family:'Lato','Segoe UI',Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100dvh;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.barre{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bord);color:#fff;padding-top:max(10px,env(safe-area-inset-top))}
.barre h1{font-size:16px;margin:0;flex:1;font-weight:700}
.barre button{background:transparent;border:1px solid rgba(255,255,255,.55);color:#fff;border-radius:20px;padding:8px 16px;font-size:14px;min-height:40px}
:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
.page{width:100%;max-width:680px;margin:0 auto;padding:16px 14px 40px}
/* verrou */
#verrou{position:fixed;inset:0;background:var(--creme);display:flex;align-items:flex-start;justify-content:center;padding:24px 18px;z-index:20;overflow:auto}
#verrou.cache{display:none}
.carte-v{width:100%;max-width:380px;text-align:center;margin-top:4vh}
.carte-v .mono{width:96px;height:96px;margin:0 auto 8px;display:block}
.carte-v h2{margin:6px 0 2px;font-size:21px}
.carte-v .sous{margin:0 0 10px;color:var(--gris);font-size:14.5px;line-height:1.5}
.carte-v label{display:block;text-align:left;font-size:13.5px;font-weight:700;margin:12px 0 4px}
.carte-v input{width:100%;padding:13px;border:1.5px solid rgba(201,162,91,.8);border-radius:14px;font-size:16px;background:#fff}
.mdp-ligne{position:relative}
.mdp-ligne button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--terra);font-weight:700;padding:10px;font-size:13.5px}
.btn{background:var(--terra);color:#fff;border:0;border-radius:26px;padding:13px 22px;font-weight:700;font-size:16px;min-height:48px}
.btn:disabled{opacity:.6}
.btn.pleine{width:100%;margin-top:16px}
.btn.sec{background:transparent;color:var(--terra);border:1.5px solid var(--terra)}
.lien{background:none;border:0;color:var(--terra);text-decoration:underline;font-size:14px;padding:10px;min-height:44px}
.err{min-height:20px;font-size:14px;color:#a3301f;margin:8px 0 0}
.ok{font-size:14px;color:#2a6a5a;margin:8px 0}
/* accueil */
.hero{text-align:center;padding:6px 0 4px}
.hero img.logo{mix-blend-mode:multiply;max-width:210px;max-height:110px;object-fit:contain;display:block;margin:0 auto 8px}
.hero .ttl{font-size:23px;font-weight:700;margin:0 0 4px;letter-spacing:.3px}
.hero .nom{font-size:19px;margin:2px 0}
.hero .role{font-size:14.5px;color:var(--gris);margin:2px 0}
.hero .prod{font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--terra);margin:6px 0 0;font-weight:700}
.infos{background:var(--beige);border:1.5px solid rgba(201,162,91,.55);border-radius:18px;padding:12px 14px;margin:14px 0;text-align:center}
.infos .dt{font-size:15px;}
.infos .hr{font-size:26px;font-weight:700;margin:0}
.infos .meteo{font-size:14.5px;color:var(--gris);margin-top:4px}
.tuiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tuile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:118px;padding:12px 8px;background:var(--beige);border:1.5px solid rgba(201,162,91,.6);border-radius:20px;color:var(--brun);font-weight:700;font-size:15.5px;text-align:center}
.tuile .e{font-size:30px;line-height:1}
.tuile small{font-weight:400;font-size:12.5px;color:var(--gris)}
.tuile:active{background:#f3dfe3}
.tuile.large{grid-column:1/-1;min-height:96px}
.inst{margin-top:18px;text-align:center}
.bandeau-b{display:inline-block;background:var(--teal);color:#fff;border-radius:12px;padding:2px 10px;font-size:12.5px;margin-left:6px}
/* vues */
.retour{background:none;border:0;color:var(--terra);font-weight:700;font-size:15px;padding:10px 0;min-height:44px}
h1,h2,.hero .ttl,.carte-v h2{font-family:'Playfair Display',Georgia,serif}
h2.vt{font-size:21px;margin:4px 0 10px}
.boite{background:#fff;border:1.5px solid rgba(201,162,91,.55);border-radius:18px;padding:13px;margin-bottom:12px}
.boite .l1{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.boite .l1 strong{font-size:16px}
.boite .l1 span{color:var(--terra);font-weight:700}
.boite .l2{font-size:13.5px;color:var(--gris);margin:3px 0;line-height:1.5}
.boite .art{font-size:13px;color:var(--gris);white-space:pre-line;line-height:1.55;margin-top:4px}
.boite .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.boite .acts a,.petit{display:inline-block;background:var(--terra);color:#fff;border:0;border-radius:20px;padding:9px 16px;font-weight:700;font-size:13.5px;text-decoration:none;min-height:40px}
.etiq{display:inline-block;border-radius:10px;padding:1px 9px;font-size:12px;font-weight:700;margin-left:6px;background:#e6efe9;color:#2a6a5a}
.etiq.ann{background:#f4dede;color:#a3301f}
.etiq.auj{background:var(--or);color:var(--brun)}
.rech{width:100%;padding:12px;border:1.5px solid rgba(201,162,91,.8);border-radius:14px;font-size:16px;background:#fff;margin-bottom:12px}
.vide{text-align:center;color:var(--gris);padding:24px 8px;line-height:1.6}
/* formulaire */
.form label{display:block;font-size:13.5px;font-weight:700;margin:10px 0 4px}
.form input,.form select,.form textarea{width:100%;padding:12px;border:1.5px solid rgba(201,162,91,.8);border-radius:12px;font-size:16px;background:#fff}
.deux{display:flex;gap:8px}.deux>div{flex:1;min-width:0}
.ligne-art{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap;margin-top:6px}
.ligne-art .a{flex:3;min-width:140px}.ligne-art .q{width:70px}.ligne-art .p{width:96px}
.ligne-art button{background:none;border:0;color:#8B2D22;text-decoration:underline;font-size:13px;padding:12px 4px}
.tot{text-align:right;font-size:17px;font-weight:700;margin:10px 0}
.tot small{display:block;font-size:13px;font-weight:400;color:var(--gris)}
.puce{display:inline-block;border:1.5px solid var(--or);border-radius:18px;padding:7px 14px;margin:4px 6px 4px 0;background:#fff;font-size:14px}
.puce.on{background:var(--terra);color:#fff;border-color:var(--terra)}
.guide-it{padding:11px 0;border-top:1px solid rgba(201,162,91,.35)}
.guide-it b{font-size:15.5px}.guide-it .f{font-size:12.5px;color:var(--terra);font-weight:700}
.guide-it .e{font-size:14px;line-height:1.5;margin-top:2px}
.aide{font-size:13.5px;color:var(--gris);line-height:1.6;background:var(--beige);border-radius:14px;padding:11px 13px;margin:10px 0}
.gd-card{background:#fff;border:1.5px solid rgba(201,162,91,.55);border-radius:18px;padding:13px;margin-bottom:12px}
.gd-card>b{font-size:18px;display:block;margin-bottom:4px}
.gd-card small{color:var(--gris)}
.btn-p{display:inline-flex;align-items:center;background:var(--terra);color:#fff;border-radius:26px;padding:12px 20px;font-weight:700;font-size:15px;min-height:46px}
@media (prefers-reduced-motion:no-preference){.tuile{transition:background .15s}}
</style>
</head>
<body>

<div id="verrou" role="dialog" aria-modal="true" aria-labelledby="v-titre">

</div>
