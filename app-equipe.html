var FICHES={"100":{"f":"Floral fruitée gourmand","t":"Cassis, Poire","h":"Iris, Jasmin, Fleur d’oranger","d":"Praliné, Vanille, Patchouli, Fève Tonka","x":"Un parfum lumineux, sucré et réconfortant, mêlant fruits juteux, fleurs élégantes et gourmandise chaude, pour une femme radieuse, optimiste et féminine.","n":""},"101":{"f":"Orientale vanillée","t":"Griotte, Amande, Fruits Rouges, Bergamote","h":"Réglisse, Rose, Thé, Rose de Taïf","d":"Vanille, Anis, Fève tonka, Patchouli, Iris","x":"Un parfum gourmand floral poudré, à la fois fruité, légèrement épicé, avec une élégance orientale subtile et un fond chaud et sensuel. Il dégage une impression de féminité raffinée, enveloppante, sophistiquée mais accessible.","n":""},"102":{"f":"Orientale vanillée","t":"Barbe à papa, Noix de coco, Bourgeon de cassis, Melon, Jasmin, Bergamote, Ananas, Mandarine","h":"Miel, Fruits Rouges, Mûre, Prune, Abricot, Jasmin, Pêche, Noix de muscade, Carvi, Orchidée, Rose, Muguet","d":"Patchouli, Chocolat, Caramel, Vanille, Fève de tonka, Ambre, Mucs, Bois de santal","x":"Un parfum gourmand et audacieux, qui débute sur une explosion fruitée juteuse et colorée, puis dévoile un cœur sucré enveloppé de notes florales poudrées. En fond, le mélange intense de chocolat noir, caramel, vanille et bois précieux dépose un sillage puissant, chaleureux et inoubliable. Une essence qui ne laisse personne indifférent.","n":""},"103":{"f":"Floral fruitée","t":"Poire, Melon, Magnolia, Pêche, Mandarine, Bergamote","h":"Jasmin, Muguet, Tubéreuse, Freesia, Rose, Orchidée, Violette, Prune","d":"Musc, Vanille, Cèdre, Mûre","x":"Un parfum lumineux et féminin, où la fraîcheur des fruits du verger (poire, pêche, melon) rencontre un bouquet floral raffiné de jasmin, de rose et de magnolia. Son fond de musc et de vanille, légèrement boisé, laisse un sillage doux et sensuel. Une ode à l’élégance radieuse et à un charme intemporel, pour une femme élégante, solaire et sensuelle.","n":""},"104":{"f":"Floral fruitée","t":"Framboise, Néroli, Limone Costa d’Amalfi","h":"Jasmin, Fleur d’oranger d’Afrique, Gardénia","d":"Miel Blanc, Patchouli, Ambre","x":"Une fragrance opulente et audacieuse, qui allie la fraîcheur juteuse de la framboise et du cédrat à un cœur floral lumineux et sensuel, dominé par le jasmin et la fleur d’oranger. En fond, le miel doré et le patchouli enveloppent la peau d’un sillage addictif et rayonnant, symbole d’une féminité confiante et éclatante.","n":""},"105":{"f":"Orientale vanillée","t":"Poire, Poivre rose, Fleur d’oranger","h":"Café, Jasmin, Amande amère, Réglisse","d":"Vanille, Patchouli, Bois de cachemire, Cèdre","x":"Un parfum addictif et vibrant, porté par un accord de poire juteuse et de poivre rose épicé. Son cœur révèle une fleur d’oranger envoûtante fusionnée au jasmin et au café intense, pour une féminité affirmée. En fond, la vanille et le patchouli, adoucis par les bois précieux, laissent un sillage profond et enivrant, à la fois mystérieux et sensuel.","n":""},"106":{"f":"Orientale floral","t":"Orange, Mandarine, Bergamote, Fleur d’oranger","h":"Rose de Turquie, Jasmin, Mimosa, Ylang-Ylang","d":"Patchouli, Musc Blanc, Vanille, Vétiver, Fève de tonka, Opoponax","x":"Une fragrance à la double facette : la fraîcheur hespéridée en ouverture, un cœur floral sophistiqué, et un fond sensuel et boisé. Elle incarne la femme affirmée et élégante, avec un brin d’insolence chic.","n":""},"107":{"f":"Floral fruitée gourmand","t":"Badiane de Chine, Violette, Lierre","h":"Réglisse, Cerise, Iris, Racine d’iris, Amaryllis","d":"Vanille, Praliné, Fève de tonka, Musc blanc, Vétiver","x":"Une fragrance gourmande florale fruitée, très féminine et enveloppante, avec un départ juteux et lumineux, un cœur floral tendre et raffiné, et un fond chaud, doux et musqué, parfait pour une femme joyeuse, sensuelle et élégante.","n":""},"108":{"f":"Floral aldéhydée","t":"Aldéhydes, Ylang-ylang, Néroli, Citron, Bergamote","h":"Rose, Iris, Jasmin, Racine d’iris, Muguet","d":"Civette, Ambre, Bois de santal, Musc, Vanille, Mousse de chêne, Patchouli, Vétiver","x":"Un parfum poudré, élégant et enveloppant, avec une structure olfactive complexe et magistrale, incarnation de la haute parfumerie classique.","n":""},"109":{"f":"Orientale boisée","t":"Jasmin Sambac","h":"Bois de cachemire","d":"Ambre","x":"Un parfum magnétique et envoûtant, à la fois lumineux et mystérieux. Le jasmin sambac s’y exprime avec chaleur et intensité, porté par la douceur du bois de cachemire, avant de se fondre dans un fond ambré et sensuel qui enveloppe la peau. Une fragrance solaire et féminine, au sillage chaleureux.","n":""},"110":{"f":"Chypre fruitée","t":"Bourgeon de cassis","h":"Rose de Mai, Freesia","d":"Vanille, Patchouli, Notes boisées, Ambroxan","x":"Un parfum au dualisme marqué : la fraîcheur fruitée du cassis, l’élégance florale, et un fond chaud et enveloppant, pour une femme affirmée et douce à la fois.","n":""},"111":{"f":"Orientale floral","t":"Rose de Bulgarie, Aubépine, Cassis, Mandarine","h":"Violette de Parme, Rose, Opoponax, Jasmin","d":"Vanille, Musc Blanc, Encens","x":"Un parfum poudré, floral et réconfortant, à l’identité féminine, moderne et poétique, tout en douceur, avec une vanille musquée et un fond légèrement mystérieux.","n":""},"112":{"f":"Orientale vanillée","t":"Poire, Tangerine, Bergamote","h":"Fraise, Rose noire, Orchidée, Vanille, Fruit de la passion","d":"Praliné, Caramel, Vanille, Litchi, Patchouli, Encens, Café, Réglisse, Coumarine, Papyrus","x":"Une fragrance nocturne, profonde et romantique, ultra gourmande, avec des touches florales sensuelles, et un fond mystique et chaud, parfait pour une femme fatale et magnétique.","n":""},"113":{"f":"Floral fruitée","t":"Cassis, Orange, Mandarine, Pamplemousse, Cannelle de Chine, Bergamote","h":"Rose, Abricot, Jasmin, Lys, Muguet","d":"Vanille, Fève Tonka, Musc, Ambre, Cèdre de Virginie","x":"Une fragrance énergique, sucrée et romantique, avec un départ fruité acidulé, un cœur floral lumineux et un fond chaud et réconfortant.","n":""},"114":{"f":"Floral boisée","t":"Canneberge, Poivre rose, Tamarin","h":"Cacao, Rose, Violette noire","d":"Vanille, Patchouli, Bois de massoia","x":"Un parfum à la fois fruité, floral et chocolaté, intense et envoûtant, parfait pour une femme au style libre, un peu provoc’, mais terriblement attachante.","n":""},"115":{"f":"Orientale épicée","t":"Clou de girofle, Poivre, Coriandre, Bay Saint Thomas, Prune, Jasmin, Mandarine, Bergamote, Agrumes","h":"Œillet, Cannelle, Bois de santal, Patchouli, Rose, Racine d’iris, Pêche, Muguet","d":"Encens, Myrrhe, Bois de santal, Baume de Tolu, Ambre, Opoponax, Benjoin, Ciste, Vanille, Musc, Castoréum, Cèdre, Vétiver, Noix de coco","x":"Une composition riche, orientale, charnelle, avec des épices chaudes, des fleurs intenses et un fond résineux et envoutant. Une ode à la femme fatale, sensuelle, affirmée et sophistiquée.","n":""},"116":{"f":"Orientale épicée","t":"Agrumes, Bergamote, Citron, Cèdre, Mandarine","h":"Iris, Patchouli, Vétiver, Jasmin, Rose","d":"Encens, Vanille, Cuir, Opoponax, Civette, Bois de santal, Fève de Tonka, Musc","x":"Un parfum élégant et affirmé, qui s’ouvre sur l’éclat vif des agrumes et de la bergamote, relevés d’une touche de cèdre. Le cœur dévoile un iris poudré et noble, entouré de rose et de jasmin, sur une trame boisée de patchouli et de vétiver. En fond, le cuir, l’encens et la vanille se mêlent au bois de santal et aux muscs pour un sillage chaud, profond et sophistiqué. Une signature chic pour une femme de caractère.","n":""},"117":{"f":"Orientale vanillée","t":"Noix de coco, Prune, Abricot","h":"Palissandre du Brésil, Jasmin, Tubéreuse, Carvi, Rose, Muguet","d":"Vanille, Amande, Bois de Santal, Musc","x":"Un parfum séduisant et sensuel, au charme irrésistible. Après une ouverture fruitée de noix de coco, de prune et d’abricot, la vanille et l’amande prennent le dessus et lui donnent une touche gourmande. Le cœur floral, riche et généreux, mêle jasmin, tubéreuse et rose sur une note boisée de palissandre. Le fond crémeux et chaleureux de bois de santal et de musc laisse un sillage enveloppant et persistant.","n":""},"118":{"f":"Orientale vanillée","t":"Badiane de chine, Mandarine","h":"Réglisse, Jasmin, Gardénia","d":"Vanille, Ambre, Notes boisés","x":"Un parfum sucré, chaud et légèrement épicé, où se mêlent la douceur de la vanille, la réglisse audacieuse et un fond boisé sensuel. Il exprime une féminité passionnée, puissante et indépendante.","n":""},"119":{"f":"Orientale floral","t":"Pêche, Rose, Fleur d’abricotier, Lilas, Ananas, Muguet, Bergamote","h":"Rose, Iris, Héliotrope, Jasmin","d":"Pêche, Abricot, Bois de Santal, Vanille, Ambre, Musc","x":"Une fragrance suave, lumineuse et féminine, à la fois fruitée, florale et poudrée, avec un fond chaud et réconfortant. Elle évoque un amour éternel, tendre et précieux.","n":""},"120":{"f":"Chyprée floral","t":"Mandarine d’Italie","h":"Rose, Jasmin d’Egypte","d":"Patchouli, Musc","x":"Un parfum lumineux et floral, qui s’ouvre sur la fraîcheur pétillante de la mandarine d’Italie. Le cœur révèle une rose moderne associée au jasmin d’Égypte, avant un fond de patchouli et de musc qui apporte élégance et profondeur. Une fragrance sensible et raffinée, pour une femme épanouie qui aime la vie et savoure chaque instant.","n":""},"121":{"f":"Floral","t":"Rose, Mimosa, Jacinthe, Géranium, Notes vertes, Fleur d’oranger, Capucine, Aubépine, Bergamote, Canelle de Chine","h":"Rose, Violette, Lys, Ylang-ylang, Fleur de tilleul, Muguet, Jasmin, Racine d’iris","d":"Iris, Héliotrope, Musc, Bois de santal, Mousse de chêne, Ambre, Cèdre","x":"Une fragrance classique, élégante et lumineuse, construite autour d’un cœur floral blanc noble, soutenu par un fond sensuel, musqué et légèrement sucré. Le départ d’agrumes apporte de la fraîcheur et de la vitalité, adoucie ensuite par une vanille subtile et raffinée.","n":""},"122":{"f":"Floral","t":"Pivoine, Litchi, Freesia","h":"Rose, Muguet, Magnolia","d":"Cèdre de Virginie, Ambre","x":"Un parfum féminin, lumineux et sensuel, avec un départ fruité et pétillant, un cœur floral blanc opulent et un fond chaud, doux et enveloppant. C’est une fragrance à la fois joyeuse, élégante et séduisante, idéale pour une femme radieuse et sûre d’elle.","n":""},"123":{"f":"Floral fruitée","t":"Limone Costa d’Amalfi, Citron vert","h":"Pomme Granny Smith, Praliné, Pivoine, Datura","d":"Pommier, Musc, Cèdre de Virginie","x":"Une fragrance florale chaleureuse et féminine, à la fois fraîche et sensuelle. L’ouverture aux agrumes lumineux laisse place à un cœur floral classique et élégant, puis à un fond doux, musqué, légèrement boisé et vanillé, très réconfortant et raffiné.","n":""},"124":{"f":"Floral fruitée","t":"Framboise, Fruits rouges, Bergamote, Citron","h":"Violette, Rose, Fleur d’oranger","d":"Iris, Fève de tonka, Résine, Musc, Bois de Santal","x":"Un parfum floral fruité, qui s’ouvre sur l’éclat lumineux de la framboise et des fruits rouges, avivé par la bergamote et le citron. Le cœur, raffiné, associe la violette, la rose et la fleur d’oranger, sous un voile poudré d’iris. Le fond, doux et chaleureux, mêle fève tonka, résine, musc et bois de santal. Une fragrance élégante et réconfortante, pour une femme douce, raffinée et pleine d’éclat.","n":""},"125":{"f":"Orientale épicée","t":"Clou de girofle, Cumin, Mandarine","h":"Cardamome, Carvi, Réglisse, Mangue, Ylang-ylang, Héliotrope, Gardénia","d":"Vanille, Ambre, Patchouli","x":"Un parfum floral poudré et sensuel, au départ fruité lumineux, avec un cœur floral raffiné et légèrement poudré grâce à l’iris, et un fond chaud, vanillé et musqué. Il évoque une féminité élégante, douce et rayonnante, avec une touche réconfortante et chic.","n":""},"126":{"f":"Floral","t":"","h":"","d":"","x":"Une fragrance fraîche, aromatique et florale, où l’éclat zesté de la verveine et la badiane ouvre un cœur rosé classique, soutenu par un fond boisé profond de patchouli. Une signature naturelle, lumineuse et affirmée, pour une féminité authentique et sophistiquée.","n":"Rose, Badiane de Chine, Verveine, Patchouli"},"127":{"f":"Orientale floral","t":"Cassis, Bergamote, Notes vertes","h":"Jasmin Sambac, Muguet","d":"Vanille, Fève de Tonka, Bois de Santal, Cèdre","x":"Une composition fruitée verte en tête, qui s’adoucit sur un cœur floral lumineux et printanier, avant de révéler un fond crémeux, boisé et sensuel. Elle exprime une féminité tendre, vivifiante et chaleureuse.","n":""},"128":{"f":"Orientale floral","t":"Safran, Thym, Mandarine","h":"Lys, Ylang-ylang, Orchidée","d":"Vanille, Fève de tonka, Palissandre du Brésil, Mousse chêne","x":"Un parfum oriental floral au caractère précieux, qui s’ouvre sur la chaleur du safran, relevée par le thym aromatique et l’éclat de la mandarine. Le cœur s’épanouit en un bouquet solaire et opulent de lys, d’ylang-ylang et d’orchidée. Le fond, crémeux et boisé, associe la vanille et la fève tonka au palissandre et à la mousse de chêne, pour un sillage sensuel et raffiné. Une fragrance pour une femme élégante et mystérieuse.","n":""},"129":{"f":"Orientale floral","t":"Fleur d’oranger, Badiane de Chine, Rose, Mandarine, Poire, Bergamote","h":"Ylang-ylang, Gingembre, Orchidée, Tubéreuse, Iris, Prune","d":"Vanille, Ambre, Musc, Cannelle, Bois de Santal","x":"Une composition riche et envoûtante, mêlant fruits épicés, bouquet floral opulent et fond oriental chaud. Un parfum puissant, raffiné et voluptueux, pour une féminité extravagante et charismatique.","n":""},"130":{"f":"Orientale boisée","t":"","h":"","d":"","x":"Un parfum résineux, dense et enveloppant, au fond boisé chaud et velouté, renforcé par la vanille et le musc. L’ensemble évoque une force calme et magnétique, presque hypnotique, parfaite pour une femme mystérieuse, sensuelle et affirmée.","n":"Patchouli, Baume de Tolu, Ciste de France, Vanille, Fève de Tonka, Bois de Santal, Cèdre, Vétiver, Musc Blanc"},"131":{"f":"Orientale floral","t":"Prune, Baies sauvages, Coriande, Anis, Palissandre du Brésil","h":"Tubéreuse, Encens, Miel Blanc, Cannelle, Opoponax, Œillet, Jasmin, Fleur d’oranger d’Afrique, Rose","d":"Vanille, Ambre, Bois de Santal, Musc, Héliotrope, Vétiver, Cèdre de Virginie","x":"Une fragrance intense, sensuelle et orientale, construite autour de fruits noirs épicés, d’un cœur floral charnel et opulent, et d’un fond mystérieux et enveloppant, mêlant miel, encens, bois et vanille. Une signature puissante pour une femme magnétique, envoûtante et sûre de son pouvoir.","n":""},"132":{"f":"Orientale floral","t":"Thé, Bergamote, Osmanthus","h":"Orchidée, Jasmin, Rose, Freesia, Fleur d’oranger d’Afrique","d":"Patchouli, Musc, Vanille","x":"Une fragrance florale opulente et vibrante, construite autour d’un bouquet de fleurs lumineuses et sensuelles, porté par une touche fraîche de thé et un fond vanillé, musqué et profondément addictif. C’est une composition riche, résolument féminine, à la fois romantique et puissante, pour une femme qui aime rayonner.","n":""},"133":{"f":"Floral","t":"Lys blanc, Jacinthe, Chèvrefeuille, Férule gommeuse, Fleur d’oranger, Lavande, Bergamote, Citron, Cassis","h":"Lys, Muguet, Jasmin du Maroc, Œillet, Chèvrefeuille, Tubéreuse, ylang-ylang, Iris, Rose, Racine d’iris","d":"Mousse de chêne, Encens, Musc, Cuir, Bois de Santal, Vetiver, Cèdre, Patchouli, Ambre","x":"Un floral riche, frais et poudré, à la construction classique. Les notes vertes et hespéridées s’ouvrent sur un cœur opulent de fleurs blanches et de rose, tout en élégance. Le fond, boisé, musqué et légèrement cuiré, prolonge cette signature délicate, pure et intemporelle. Une fragrance qui incarne une féminité douce, romantique et éternelle.","n":""},"134":{"f":"Floral","t":"Pêche, Bergamote, Mandarine, Citron","h":"Nénuphar, Mimosa, Tubéreuse,Melon, Lotus, Ananas, Jasmin, Muguet, Rose","d":"Patchouli, Robinier faux-acacia, Bois de Santal, Cèdre, Fève de tonka","x":"Un parfum verdoyant, fruité et aquatique, au caractère très naturel. L’ouverture mêle fruits gorgés de soleil et agrumes frais, suivie d’un cœur floral aquatique et printanier, avant de s’ancrer dans un fond boisé doux et végétal. Il évoque une femme libre, instinctive et profondément connectée à la nature, entre fraîcheur et sensualité.","n":""},"135":{"f":"Orientale vanillée","t":"Passiflore","h":"Jasmin, Gardénia","d":"Vanille, Vétiver","x":"Une fragrance enveloppante et hypnotique, construite autour d’un bouquet floral aux accents solaires et exotiques, dominé par la passiflore. Le fond, crémeux et chaud, mêle vanille douce et vétiver boisé, pour un sillage sensuel, profond et addictif. C’est une signature féminine, troublante et magnétique.","n":""},"136":{"f":"Orientale floral","t":"Poivre rose, Pêche, Poire","h":"Rose, Framboise, Fleurs blanches, Jasmin","d":"Caramel, Benjoin de Siam, Ambre, Vanille, Musc, Patchouli, Cèdre de Virginie","x":"Une fragrance sensuelle et enivrante, où la framboise et le poivre rose ouvrent un sillage vibrant et contrasté. Le cœur dévoile un bouquet floral délicat, baigné dans un fond gourmand et chaleureux, dominé par le caramel et la vanille, soutenus par des bois précieux et du musc. Une signature pour une femme libre, affirmée et profondément désirable.","n":""},"137":{"f":"Orientale floral","t":"Mure, Feuille de mandarinier, Fleur de soie","h":"Jasmin, Fleur d’oranger, Reine de la nuit, Rose","d":"Vanille, Fève tonka, Santal de Mysore","x":"Un parfum crémeux, sensuel et nocturne, où la mûre et le petit-grain livrent une fraîcheur fruitée et subtilement verte. Le cœur floral, dominé par la reine de la nuit et le jasmin, est à la fois mystérieux et envoûtant, tandis que le fond vanillé et ambré, arrondi de fève tonka, laisse un sillage intense et addictif. Une fragrance conçue pour une femme magnétique et libre, à la séduction assumée.","n":""},"138":{"f":"Orientale floral","t":"Pêche, Litchi, Mandarine, Bergamote","h":"Lys, Prune, Jasmin, Muguet","d":"Vanille, Ambre, Musc, Vétiver","x":"Un parfum sensuel, lumineux et sophistiqué, où les fruits gorgés de soleil s’ouvrent sur un cœur floral riche et voluptueux, dominé par le lys et le jasmin. Le fond, chaud et doux, mêle vanille crémeuse, ambre doré et musc, pour un sillage à la fois enveloppant et charismatique. Une fragrance parfaite pour une femme élégante, rayonnante et affirmée.","n":""},"139":{"f":"Floral","t":"Œillet, Aldéhydes, Rose, Néroli, Palissandre du Brésil, Pêche, Bergamote","h":"Œillet, Clou de Girofle, Gardénia, Jasmin, Rose, Ylangylang, Violette, Racine d’iris, Romarin, Orchidée","d":"Epices, Iris, Mousse de chêne, Musc, Bois de Santal, Benjoin, Ambre, Vétiver, Cèdre","x":"Un floral poétique, intemporel et poudré, emblème d’une féminité pure et gracieuse. L’ouverture aldéhydée et fraîche s’épanouit dans un cœur floral opulent, porté par l’œillet, la rose et l’iris. Le fond, boisé, musqué et légèrement ambré, enrobe la peau d’un sillage délicat et classique. Un parfum d’élégance éternelle, à la fois doux, lumineux et raffiné.","n":""},"140":{"f":"Orientale floral","t":"Jasmin d’eau, Mandarine, Fleur de Gingembre","h":"Vanille, Sel","d":"Bois de cachemire, Ambre gris, Bois de Santal","x":"Une fragrance solaire, sensuelle et élégante, où le gingembre et le sel donnent un départ à la fois tonique et addictif. Le jasmin, pur et lumineux, éclaire un fond vanillé et boisé, réchauffé par le santal et l’ambre gris. Ce parfum incarne une femme rayonnante, puissante et conqu rante, avec une signature olfactive à la fois divine et contemporaine.","n":""},"141":{"f":"Orientale floral","t":"Prune, Bois de cannelle de Chine, Iris, Violette, Lys, Anis, Jasmin, Mimosa, Cannelle de Chine","h":"Ylang-Ylang, Héliotrope, Racine d’iris, Fleur d’oranger, Tiaré Tahiti","d":"Encens, Vanille, Benjoin, Bois de Santal, Musc","x":"Une fragrance opulente et enveloppante, dominée par des fleurs poudrées et solaires, réchauffées d’un fond oriental balsamique aux accents d’encens, vanille et santal. L’ouverture fruitée aux notes de prune noire et d’anis apporte mystère et profondeur. Elle incarne une féminité sensuelle, rétro et affirmée, à la présence magnétique et réconfortante.","n":""},"142":{"f":"Chyprée floral","t":"Patchouli, Poivre rose, Ananas, Jacinthe, Iris","h":"Citron, Jasmin, Rose","d":"Patchouli, Musc, Vétiver, Vanille","x":"Une fragrance lumineuse, pétillante et féminine, qui s’ouvre sur un accord vif d’agrumes et de fruits frais, mêlé à une note épicée subtile. Le cœur floral dévoile un bouquet délicat et élégant, dominé par la rose et l’iris. En fond, un sillage chic et moderne, où se rencontrent patchouli, musc et vanille, pour une signature chaleureuse et affirmée.","n":""},"143":{"f":"Chyprée fruitée","t":"Pêche, Nectarine, Abricot, Carvi, Anis, Menthe","h":"Cannelle, Litchi, Rose, Huile essentielle de rose, Œillet, Violette, Iris, Jasmin, Muguet","d":"Mousse de Chêne, Ambre, Benjoin, Vanille, Patchouli, Styrax, Cèdre, Musc, Noix de Coco, Vétiver","x":"Une fragrance exubérante et féminine, aux accords de fruits jaunes veloutés et d’épices fraîches, sur un cœur floral chaleureux et légèrement rétro. Son fond, chypré et oriental, mêle vanille, résines, patchouli et mousse, pour un sillage à la fois épanoui, opulent et résolument élégant. Un parfum de plaisir assumé, sensuel et pétillant.","n":""},"144":{"f":"Orientale vanillée","t":"","h":"","d":"","x":"Une fragrance harmonieuse, féminine et moderne, construite comme un jeu d’équilibres entre fraîcheur fruitée, cœur floral éclatant, et fond boisé vanillé. L’alliance de la pivoine, du lotus et du magnolia lui confère une élégance fluide et lumineuse, tandis que la vanille et le cèdre assurent une tenue à la fois douce et affirmée. Un parfum élégant et intemporel, à l’image d’une femme raffinée et indépendante.","n":"Pêche, Vanille, Mandarine, Jasmin, Bergamote, Magnolia, Cèdre, Fleur d’oranger, Vétiver, Rose, Pivoine, Lotus"},"147":{"f":"Orientale épicée","t":"Rose de Bulgarie, Coriandre, Pêche, Jasmin, Mandarine","h":"Clou de girofle, Rose, Mimosa, Fleur d’Oranger, Trèfle","d":"Ambre, Bois de Santal, Opoponax, Fêve de tonka, Civette, Vanille, Ciste","x":"Un parfum riche, oriental et épicé, à la fois sophistiqué et affirmé. L’ouverture mêle des fruits gorgés de soleil et des épices vibrantes, avant de laisser place à un cœur floral opulent et poudré. Le fond, profond et sensuel, marie ambre, vanille et résines, avec une touche animale et sacrée. Une fragrance pour une femme puissante, élégante et intemporelle, au charisme naturel.","n":""},"150":{"f":"Hesperidée","t":"Citron, Bergamote, Chèvrefeuille, Mandarine","h":"Basilic, Romarin, Coriande, Jasmin","d":"Mousse de chêne, Vétiver, Bois de Santal","x":"Une fragrance fraîche et vivifiante, au départ tonique d’agrumes et d’herbes aromatiques, qui s’ouvre sur un cœur floral délicat de jasmin et chèvrefeuille. Le fond, légèrement boisé et mousseux, lui confère une élégance naturelle et une fraîcheur persistante. Une eau qui évoque une femme active et spontanée, amoureuse de nature et de liberté.","n":""},"152":{"f":"Hesperidée aromatique","t":"Citron Vert, Citron, Basilic, Bergamote, Pamplemousse, Mandarine, Verveine","h":"Coriandre, Patchouli, Œillet, Narcisse, Jasmin, Rose sauvage","d":"Mousse de chêne, Vétiver, Musc, Bois de Santal, Ambre","x":"Un parfum tonique et élégant, dominé par une envolée d’agrumes zestés et d’herbes aromatiques, intensément rafraîchissante. Son cœur floral classique, porté par le jasmin et la rose, se fond dans un fond boisé, mousseux et musqué, à la fois naturel et racé. Une fragrance intemporelle, parfaite pour une femme vivante, raffinée et sereine.","n":""},"153":{"f":"Orientale vanillée","t":"Riz, Thé blanc","h":"Frangipanier, Fleur de cerisier, Héliotrope","d":"Vanille, Musc, Encens, Bois de Thanaka","x":"Une fragrance douce, cocooning et réconfortante, qui mêle la tendresse poudrée du riz et du frangipanier à la délicatesse florale de la fleur de cerisier. Le cœur, suave et intime, s’enrichit d’un souffle de thé et d’héliotrope, tandis que le fond, vanillé et musqué, s’enveloppe d’un nuage lacté et apaisant. Une ode à la féminité délicate et aux instants suspendus.","n":""},"154":{"f":"Floral","t":"Jasmin, Orange, Bergamote, Mandarine de Sicile","h":"Gardénia, Fleur d’oranger","d":"Bois de Santal, Ambre blanc, Cèdre, Musc blanc","x":"Un parfum floral lumineux, qui s’ouvre sur la fraîcheur solaire des agrumes (orange, bergamote et mandarine de Sicile) mêlée au jasmin. Le cœur dévoile un bouquet de fleurs blanches crémeuses, où le gardénia et la fleur d’oranger s’épanouissent avec douceur. Le fond, propre et enveloppant, associe le bois de santal, l’ambre blanc, le cèdre et le musc blanc. Une fragrance pure et élégante, pour une femme naturelle et rayonnante.","n":""},"155":{"f":"Orientale floral","t":"BGéranium, Freesia, Bergamote, Notes vertes","h":"Rose, Iris, Orchidée, Magnolia, Jasmin, Muguet","d":"Vanille, Ambre, Patchouli, Musc, Cèdre","x":"Une fragrance romantique et charnelle, aux notes florales poudrées et veloutées enrichies de rose, iris et jasmin. L’ouverture fraîche et verte contraste avec un fond ambré et vanillé, délicatement boisé. Le tout offre un sillage doux et enveloppant, entre féminité classique et sensualité assumée.","n":""},"157":{"f":"Floral fruitée gourmand","t":"Pêche, Mandarine, Orange","h":"Caramel, Fleur d’oranger, Jasmin","d":"Ambre, Bois de Santal, Gaïac, Cèdre","x":"Un parfum gourmand et charmeur, où les fruits juteux s’associent à un cœur floral ensoleillé et sensuel. Le fond, dominé par un caramel fondant et des bois doux, crée un sillage délicieusement sucré et sophistiqué. Idéal pour une femme à la fois espiègle et ultra féminine, qui aime séduire sans en avoir l’air.","n":""},"158":{"f":"Floral aquatique","t":"Lotus, Melon, Freesia, Eau de rose, Rose, Calone, Cyclamen","h":"Muguet, Lys, Pivoine d’eau, Œillet","d":"Musc, Tubéreuse, Bois exotiques, Osmanthus, Cèdre, Bois de Santal, Ambre","x":"Un parfum aérien, pur et fluide, inspiré par la fraîcheur de l’eau et la délicatesse des fleurs. L’alliance du melon juteux et du calone cristallin ouvre un sillage limpide, prolongé par un bouquet floral aquatique et lumineux. Le fond, subtilement boisé et musqué, renforce cette sensation de fraîcheur longue tenue, tout en douceur et en transparence.","n":""},"164":{"f":"Chyprée foral","t":"Pamplemousse, Mandarine","h":"Mousse de chêne, Genévrier, Patchouli, Poivre, Œillet, Iris, Rose, Seringat, Ciste de France, Jasmin, Muguet, Ylang-ylang","d":"Mucs, Ambre","x":"Un parfum noble et racé, à la structure chyprée classique. L’ouverture associe des agrumes pétillants et des épices vibrantes, avant de dévoiler un cœur f loral riche et sophistiqué. Le fond, construit autour de la mousse de chêne, du patchouli et du musc, confère un sillage profond, élégant et intemporel, à l’image d’une femme de caractère et de distinction.","n":""},"165":{"f":"Boisée","t":"Orange, Résine d’élémi, Citron","h":"Ambre, Poivre, Poivre rose, Violette","d":"Sapin, Cèdre, Vétiver de Madagascar, Mousse de chêne, Benjoin","x":"Une fragrance lumineuse et boisée, à l’ouverture tonique et épicée, portée par les agrumes zestés et les résines vibrantes. En cœur, une violette délicate vient adoucir la composition, tandis que le fond mêle bois nobles, ambre et mousse, pour un sillage à la fois minéral, chaud et aérien. Un parfum élégant, sophistiqué sans ostentation, pour une femme libre et rêveuse.","n":""},"166":{"f":"Orientale vanillée","t":"Bigarade, Citron","h":"Rose de Damas, Rose de Grasse, Fleur d’oranger","d":"Vanille, Amande, Fève de Tonka, Baume de Tolu, Bois de Santal, Héliotrope, Bois de Cachemire","x":"Un parfum audacieux et sensuel, à l’ouverture contrastée entre la fraîcheur du cédrat et l’amertume de la bigarade, sublimée par une amande douce et addictive. Le cœur floral, dominé par la rose et la fleur d’oranger, s’enveloppe d’un fond onctueux et chaleureux, mêlant vanille, bois précieux et baumes orientaux. Une signature affirmée pour une femme libre, charnelle et magnétique.","n":""},"167":{"f":"Chyprée fruitée","t":"Fraise, Framboise, Poire, Orange, Bergamote de Calabre, Tangerine, Calone","h":"Pivoine, Jasmin Sambac, Jasmin de Chine, Datura, Fleur d’Oranger","d":"Feuille de patchouli d’Indonésie, Patchouli, Musc Blanc, Vanille, Ambroxan, Mousse, Cèdre","x":"Un parfum ultra féminin et enivrant, où les fruits rouges éclatants rencontrent la fraîcheur hespéridée. Le cœur floral opulent et narcotique révèle une sensualité intense portée par la datura et le jasmin, tandis que le fond chypré et musqué, enrichi de vanille et patchouli, signe un sillage profond, addictif et vibrant d’émotion.","n":""},"168":{"f":"Floral","t":"Fruits Rouges","h":"Pivoine, Notes fleuries, Jasmin d’Egypte","d":"Ambroxan","x":"Un parfum explosif et vibrant, qui s’ouvre sur un cocktail de fruits rouges juteux et lumineux. Le cœur floral, dominé par la pivoine et le jasmin, évoque une féminité libre, moderne et joyeuse. Le fond, porté par l’ambroxan, prolonge la fraîcheur dans un sillage sensuel, pur et enveloppant, à la fois urbain et audacieux.","n":""},"169":{"f":"Orientale boisée","t":"Lavande, Bergamote","h":"Iris, Jasmin Sambac, Rose","d":"Vanille de Tahiti, Coumarine, Santal d’Australie, Réglisse, Benjoin, Patchouli","x":"Un parfum profond et raffiné, où la fraîcheur de la bergamote introduit un cœur floral riche et poudré, dominé par la lavande, l’iris et la rose, adouci d’une touche de réglisse suave. En fond, la vanille se mêle aux bois chauds et aux résines, offrant un sillage à la fois enveloppant, féminin et d’une grande élégance contemporaine.","n":""},"170":{"f":"Floral","t":"Pamplemousse, Mandarine, Cassis","h":"Fleur d’oranger, Jasmin, Ylang- Ylang, Tubéreuse, Muguet, Poire, Poivre rose","d":"Musc, Bois de Santal, Bois de cachemire, Racine d’iris","x":"Une fragrance solaire et sophistiquée, construite autour d’un bouquet floral blanc opulent aux accents sensuels de tubéreuse, jasmin et ylangylang. L’ouverture fruitée et fraîche mêle agrumes et poire juteuse, avant de s’épanouir sur un fond crémeux et musqué, prolongé par la douceur enveloppante du cashmeran. Une signature féminine élégante, rayonnante et libre.","n":""},"171":{"f":"Orientale","t":"Rhubarbe, Bergamote","h":"Notes vertes, Fleur d’oranger, Ylang-ylang, Poire","d":"Vanille bourbon, Notes boisées, Amberwood, Bois de Santal, Coumarine, Wolfwood","x":"Un parfum à l’instinct sauvage et sensuel, où la fraîcheur végétale de la rhubarbe et des notes vertes se mêle à une poire tendre et juteuse. En cœur, la fleur d’oranger et l’ylang-ylang révèlent une sensualité florale, avant de s’abandonner dans un fond boisé, vanillé et lacté, d’une intensité magnetique et envoûtante.","n":""},"172":{"f":"Chyprée floral","t":"Orange sanguine, Mandarine","h":"Miel, Gardénia, Fleur d’oranger, Jasmin, Pêche","d":"Cire d’Abeille, Caramel, Patchouli, Réglisse","x":"Un parfum audacieux et enivrant, mêlant la gourmandise du miel et du caramel à un cœur floral sensuel, porté par le gardénia et la fleur d’oranger. L’ouverture fruitée est éclatante, tandis que le fond suave et généreux évoque une féminité affirmée, séductrice et irrésistible.","n":""},"173":{"f":"Orientale vanillée","t":"Poivre rose, Jasmin Sambac, Arbre à soie","h":"Crème fouettée, Vanille, Châtaigne","d":"Bois de Santal, Bois de cachemire","x":"Une fragrance ultra sensuelle et créative, qui marie la chaleur du bois de cachemire et du santal à la douceur onctueuse de la crème fouettée et de la vanille. La châtaigne rôtie et le poivre rose signent une personnalité contrastée, à la fois rebelle, tendre et addictive. Une essence libre et assumée, à l’image d’une féminité moderne et décalée.","n":""},"175":{"f":"Orientale floral","t":"Poire, Bergamote","h":"Tubéreuse, Fleur d’oranger, Jasmin Sambac","d":"Patchouli, Vanille, Ambroxan, Vétiver","x":"Une fragrance intense et contrastée, où la fraîcheur fruitée de la poire et de la bergamote s’ouvre sur un cœur floral blanc enivrant. Le fond, mêlant vanille sensuelle, patchouli profond et ambroxan moderne, confère au parfum un sillage audacieux et addictif. Une invitation à braver l’interdit avec élégance et assurance.","n":""},"176":{"f":"Floral fruitée musquée","t":"Fleur d’oranger d’Afrique, Osmanthus, Bergamote","h":"Mucs, Ambre","d":"Vétiver, Patchouli, Vanille","x":"Un parfum floral musqué, lumineux et chaleureux, qui s’ouvre sur la fraîcheur de la bergamote et la douceur solaire de la fleur d’oranger d’Afrique et de l’osmanthus. Le cœur, enveloppant, mêle le musc et l’ambre, avant un fond de vétiver, de patchouli et de vanille qui laisse un sillage doux, chaud et réconfortant. Une fragrance joyeuse et élégante, pour une femme radieuse et optimiste.","n":""},"177":{"f":"Orientale floral","t":"Framboise, Mandarine, Bergamote, Citron","h":"Gardénia, Fleur de gingembre, Ambre, Jasmin, Fleur d’oranger, Rose","d":"Lait, Caramel, Vanille, Cardamome, Réglisse, Coumarine, Benjoin, Bois de Santal, Amberwood","x":"Un parfum ultra gourmand et audacieux, qui s’ouvre sur un cocktail épicé de gingembre et cardamome, adouci par une framboise éclatante. Le cœur révèle un accord lacté original mêlé à des fleurs blanches sensuelles et une touche de réglisse intrigante. Le fond, chaud et addictif, associe caramel fondant, vanille crémeuse et bois ambrés, pour une signature affirmée, féminine et résolument moderne.","n":""},"178":{"f":"Orientale floral","t":"","h":"","d":"","x":"Un parfum audacieux et envoûtant, qui mêle la gourmandise inattendue du popcorn à l’exotisme lumineux de l’ylang-ylang et de la fleur d’oranger. Le fond crémeux et chaleureux, dominé par la vanille, le musc et le bois de santal, dessine un sillage addictif et voluptueux, à la sensualité affirmée.","n":"Popcorn, Vanille, Ylang-ylang, Noix de coco, Pêche, Fleur d’oranger, Musc blanc, Amberwood, Bois de Santal, Ambrette"},"179":{"f":"Orientale fougère","t":"Lavande, Mandarine, Cassis, Petit-grain","h":"Lavande, Fleur d’Oranger, Jasmin","d":"Vanille de Madagascar, Musc, Cèdre, Ambre Gris","x":"Une fragrance audacieuse, qui casse les codes en mêlant une structure fougère classique à une féminité affirmée. La lavande aromatique, emblème des parfums masculins, se pare ici de fleur d’oranger solaire et de jasmin sensuel. Le fond, chaud et enveloppant, associe vanille, musc et ambre gris pour un sillage intense, vibrant et terriblement élégant. Eau de parfum · 14 % d'extrait de parfum · 75 ml & recharge 125 ml · 37 parfums","n":""},"200":{"f":"Boisée épicée","t":"Mandarine sanguine, Pamplemousse, Menthe","h":"Cannelle, Notes épicées, Rose","d":"Ambre, Cuir, Notes boisées, Patchouli d’Inde","x":"Un parfum puissant et magnétique, qui s’ouvre sur une envolée d’agrumes frais et de menthe vive, vite réchauffée par un cœur épicé et sensuel, où la cannelle et la rose s’entrelacent. Le fond boisé, marqué par des accords d’ambre, de cuir et de patchouli, laisse un sillage affirmé, enveloppant et résolument charismatique. Une fragrance pour l’homme ambitieux, audacieux et inoubliable.","n":""},"201":{"f":"Boisée aquatique","t":"Notes marines, Pamplemousse, Mandarine","h":"Feuille de laurier, Jasmin","d":"Ambre gris, Gaïac, Mousse de chêne, Patchouli","x":"Un parfum tonique et moderne, qui démarre sur une vague marine fraîche et énergisante, soutenue par des agrumes éclatants. Le cœur dévoile un accord vert et floral, avant de s’ancrer dans un fond boisé et ambré, à la fois puissant et raffiné. Une fragrance pour l’homme conquérant, résolu et en pleine maîtrise.","n":""},"202":{"f":"Orientale fougère","t":"Lavande, Menthe, Cardamome, Bergamote, Armoise","h":"Cannelle, Fleur d’oranger, Carvi","d":"Vanille, Fève tonka, Ambre, Bois de Santal, Cèdre","x":"Un parfum iconique et enveloppant, à l’ouverture fraîche et aromatique, portée par la menthe et la cardamome. Son cœur mêle la lavande classique à des notes épicées et florales, dans un contraste audacieux. Le fond, crémeux et sensuel, dévoile une signature chaude de vanille, fève tonka et bois précieux, pour un sillage à la fois doux, viril et inoubliable.","n":""},"203":{"f":"Aromatique verte","t":"Pomme verte, Lavande, Menthe, Pamplemousse, Basilic","h":"Sauge, Géranium, Œillet, Jasmin","d":"Sapin, Cèdre, Patchouli","x":"Une fragrance fraîche et structurée, portée par l’énergie verte et boisée du pin mêlée à la lavande aromatique. Le cœur résineux laisse place à un fond sec et élégant, marqué par le sapin et les bois clairs, pour un parfum moderne, rassurant et viril.","n":""},"204":{"f":"Boisée épicée","t":"Cardamome","h":"Lavande, Cèdre de Virginie, Bergamote","d":"Vétiver, Carvi","x":"Une fragrance magnétique et contrastée, mêlant des épices fraîches et piquantes à la lavande sensuelle. Le fond boisé et profond, souligné par le vétiver, donne à ce parfum une aura élégante, mystérieuse et irrésistiblement masculine.","n":""},"205":{"f":"Orientale boisée","t":"Agrumes, Citron, Sauge, Tagètes","h":"Praliné, Cannelle, Baume de Tolu, Cardamome noire","d":"Patchouli, Ambre noire, Ébène, Palissandre","x":"Une fragrance gourmande et rebelle, conjuguant des notes d’agrumes épicées à un cœur aromatique et chaud, avant de plonger dans un fond boisé-sucré, porté par des accords de praliné, ébène et ambre gris. Un parfum audacieux pour un homme libre et instinctif.","n":""},"206":{"f":"Aromatique aquatique","t":"Citron vert, Citron, Bergamote, Jasmin, Orange, Mandarine, Néroli","h":"Notes marines, Jasmin, Calone, Romarin, Pêche, Freesia, Jacinthe, Cyclamen, Violette, Coriandre, Rose, Noix de muscade, Réséda","d":"Musc blanc, Cèdre, Mousse de chêne, Patchouli, Ambre","x":"Un parfum pur et rafraîchissant, comme une brise marine sur la peau. L’ouverture agrumée et aquatique est suivie d’un cœur floral léger, puis d’un fond musc-ambré cristallin, pour une sensation de propreté élégante et intemporelle.","n":""},"207":{"f":"Boisée aromatique","t":"Pamplemousse, Citron, Menthe, Poivre rose","h":"Gingembre, Noix de muscade, Jasmin, Iso E super","d":"Encens, Cèdre, Vétiver, Bois de Santal, Patchouli, Ciste, Musc blanc","x":"Une fragrance profonde et sophistiquée, où les agrumes et épices fusent sur un cœur aromatique et masculin, avant de se fondre dans un fond boisé, fumé et moderne. Le sillage est charismatique, élégant et affirmé.","n":""},"208":{"f":"Hespéridée aromatique","t":"Citron, Romarin, Bergamote, Néroli, Ananas","h":"Jasmin, Mousse de chêne, Cyclamen, Coriandre","d":"Musc, Mousse de chêne, Cèdre, Bois de Santal, Cardamome, Palissandre du Brésil, Fève de tonka","x":"Un parfum vif et lumineux, alliant la fraîcheur d’agrumes zestés et d’herbes aromatiques à une base boisée-musquée raffinée. L’élégance moderne d’un homme en mouvement, à la fois tonique et serein.","n":""},"209":{"f":"Fougère aromatique","t":"Anis, Pamplemousse","h":"Framboise, Lavande","d":"Notes Boisées, Héliotrope","x":"Une fragrance à la fois douce et charismatique, dominée par une framboise gourmande et un cœur lavandé délicat, qui s’évanouit sur un fond boisé sensuel. Pour un homme magnétique, rêveur et audacieux.","n":""},"210":{"f":"Fougère aromatique","t":"Fleur de muscadier, Lavande, Cèdre, Mandarine, Camomille, Bergamote, Aubépine, Citron","h":"Feuille de violette, Noix de muscade, Cèdre, Bois de santal, Œillet, Chèvrefeuille, Jasmin, Muguet","d":"Cuir, Vétiver, Musc, Ambre, Patchouli, Fève de tonka","x":"Un parfum brûlant et floral, où les notes vertes et aromatiques se fondent dans un cœur floral riche et un fond cuiré, boisé et charnel. Une fragrance culte, pour un homme passionné, affirmé et original.","n":""},"211":{"f":"Boisée épicée","t":"Orange, Pamplemousse","h":"Poivre, Pélargonium, Silex","d":"Vétiver, Cèdre, Patchouli, Benjoin","x":"Un parfum minéral et racé, entre la vibration des agrumes et des épices, et la profondeur terreuse et boisée du vétiver. Pour un homme authentique, solide, profondément connecté à la nature.","n":""},"212":{"f":"Orientale boisée","t":"Orange, Pamplemousse","h":"Poivre, Pélargonium, Silex","d":"Vétiver, Cèdre, Patchouli, Benjoin","x":"Un parfum intense et contrasté, mariant des agrumes fusants à une violette urbaine et fraîche, avant de s’enraciner dans un fond cuiré, ambré et résineux. Une signature affirmée, contemporaine et virile.","n":""},"213":{"f":"Boisée épicée","t":"Orange, Notes marines, Aldéhydes, Mandarine sanguine","h":"Poivre, Néroli, Cèdre","d":"Vanille, Fève de tonka, Musc blanc, Ambre, Vétiver, Résine d’élémi","x":"Un parfum tonique et élégant, qui mêle fraîcheur marine et agrumes pétillants à des épices vives et des bois chaleureux. La fève tonka et la vanille adoucissent un fond ambre et vétiver, pour une signature aussi fraîche que charismatique.","n":""},"214":{"f":"Boisée aromatique","t":"Agrumes, Fleur d’oranger, Bigarade, Romarin","h":"Amande, Fève de tonka","d":"Cuir, Cèdre, Vétiver","x":"Un parfum élégant et singulier, où la fraîcheur fusante des agrumes se mêle à une amande douce et suave. Le cœur floral s’épanouit sur un fond boisé, cuiré et sensuel, laissant une impression raffinée et résolument moderne.","n":""},"215":{"f":"Boisée floral musquée","t":"Lavande, Bergamote, Sauge","h":"Iris, Cacao, Ambre","d":"Cuir, Vétiver, Patchouli","x":"Une fragrance subtile et élégante, construite autour d’un iris poudré masculin, réhaussé de poivre rose et d’agrumes vifs. Le fond, aux accents secs et boisés, met en valeur un vétiver racé et une résine d’élémi résolument contemporaine.","n":""},"216":{"f":"Hespéridée aromatique","t":"Citron, Bergamote, Basilic, Romarin, Carvi, Notes fruitées","h":"Jasmin, Coriandre, Œillet, Patchouli, Racine d’iris, Bois de santal, Rose, Lavande, Hedione","d":"Mousse de chêne, Vétiver, Musc, Ambre","x":"Un parfum frais, aromatique et intemporel, où les agrumes et herbes fraîches ouvrent la composition avec éclat. Le cœur floral s’adoucit sur un fond mousseux, boisé et ambré, pour une signature à la fois classique et toujours actuelle.","n":""},"218":{"f":"Orientale boisée","t":"Lavande, Menthe, Notes fruitées épicées, Coriandre, Notes vertes, Bergamote","h":"Caramel, Patchouli, Miel, Lait, Cèdre, Jasmin, Muguet","d":"Café, Patchouli, Vanille, Fève de tonka, Benjoin, Ambre, Bois de santal, Musc","x":"Une fragrance gourmande et puissante, construite sur un contraste de fraîcheur mentholée et d’accords sucrés. Le cœur onctueux aux accents lactés et floraux s’épanouit dans un fond intense de caramel, vanille et bois ambrés. Pour un homme extravagant, audacieux et inoubliable.","n":""},"219":{"f":"Hespéridée aromatique","t":"Citron, Notes vertes, Bergamote, Ananas, Mandarine, Cardamone, Papaye","h":"Muguet, Jasmin, Violette, Rose, Noix de muscade, Racine d’iris, Freesia","d":"Accord vert, Musc, Cèdre, Thé vert, Bois de santal, Mousse de chêne, Ambre","x":"Un parfum léger et universel, porté par des notes hespéridées et fruitées, sur un cœur floral doux et un fond boisé-musqué apaisant. Une fraîcheur moderne, conçue pour une liberté d’expression sans genre.","n":""},"221":{"f":"Orientale boisée","t":"Citron, Pêche, Gingembre, Mandarine, Lavande, Bergamote","h":"Poivre, Cèdre, Patchouli, Vétiver, Jasmin, Palissandre du Brésil, Rose, Gardénia, Anis, Freesia","d":"Vanille, Fève de tonka, Bois de santal, Noix de coco, Ambre, Benjoin, Musc, Cuir, Mousse de chêne","x":"Une fragrance équilibrée et raffinée, qui marie la fraîcheur fruitée et épicée de l’ouverture à un cœur floral délicat. Le fond, opulent et sensuel, mêle vanille, bois nobles et cuir dans un sillage profond et intemporel, empreint d’élégance naturelle. Pour un homme à la fois libre, sophistiqué et sûr de lui.","n":""},"222":{"f":"Boisée floral musquée","t":"Bigarade, Carvi, Bouleau, Bergamote, Coriandre, Mandarine, Néroli, Armoise","h":"Cardamome du Guatémala, Poivre, Gingembre, Iris, Genévrier, Cannelle, Racine d’iris, Jasmin","d":"Vétiver de Tahiti, Thé, Cèdre, Cuir, Mousse de chêne, Ambre","x":"Un parfum raffiné et élégant, qui associe l’éclat des agrumes à des épices vives : bigarade, bergamote et mandarine s’ouvrent sur des notes piquantes de coriandre et de carvi. Le cœur, aromatique et floral, met en avant l’iris, relevé de cardamome, de gingembre et de poivre. Le fond, cuiré, boisé et presque fumé, gagne en profondeur grâce au vétiver de Tahiti, au thé, au cèdre et à la mousse de chêne. Une fragrance affirmée et intemporelle, pour un homme indépendant et curieux, qui aime les parfums de caractère.","n":""},"224":{"f":"Boisée épicée","t":"Poivre rose, Élémi, Bergamote, Pamplemousse","h":"Cannelle, Paprika, Safran","d":"Tabac, Cuir, Vétiver","x":"Un parfum explosif et racé, qui déploie un départ vif de poivre rose et d’agrumes épicés, rapidement enflammé par un cœur chaud et brûlant de piment et cannelle. Le fond, dominé par le tabac blond, le cuir et le vétiver, laisse un sillage intense, viril et magnétique. Une essence conçue pour les hommes au charme incendiaire.","n":""},"225":{"f":"Fougère aromatique","t":"Bergamote de Calabre, Poivre","h":"Poivre du Sichuan, Lavande, Poivre rose, Vétiver, Patchouli, Géranium, Élémi","d":"Ambroxan, Cèdre, Ciste","x":"Un parfum brut et lumineux, dominé par un cocktail explosif de poivres épicés et de bergamote fraîche. Le cœur mêle la lavande et le géranium, ajoutant élégance et équilibre, tandis que le fond boisé, ambré et sec, porté par l’ambroxan, impose un sillage moderne et sauvage. Une essence libre et indomptée, pour l’homme magnétique et instinctif.","n":""},"226":{"f":"Orientale vanille","t":"Anis, Réglisse, Violette, Lierre, Absinthe, Basilic","h":"Rhum, Fève de tonka, Amande, Bois de santal","d":"Vanille, Praliné, Vétiver, Cèdre, Ciste","x":"Un parfum mystérieux et sensuel, où la badiane anisée et la bergamote fraîche rencontrent un cœur poudré d’iris, avant de s’enfoncer dans un sillage profond de myrrhe envoûtante, oud précieux et vétiver racé. Une composition intense, élégante et résolument affirmée.","n":""},"229":{"f":"Aromatique aquatique","t":"Notes marines, Acajou, Sauge, Bergamote, Citron","h":"Pin, Baies de genévrier, Œillet, Noix de muscade, Rose, Muguet, Carvi, Jasmin, Pêche, Racine d’iris","d":"Sapin baumier, Bois de santal, Cèdre, Musc, Mousse de chêne, Vétiver, Ambre, Ciste","x":"Une fragrance aquatique et végétale, à la fois fraîche et profonde, qui évoque l’immensité naturelle et la liberté. Les notes marines s’unissent à la pêche veloutée et aux baies fraîches, avant de révéler un cœur herbacé et floral, soutenu par un fond boisé et mousseux, empreint de tranquillité brute.","n":""},"230":{"f":"Boisée épicée","t":"Pomme, Prune, Bergamote, Citron, Mousse de chêne, Géranium","h":"Cannelle, Acajou, Œillet","d":"Vanille, Bois de Santal, Cèdre, Vétiver, Olivier","x":"Un parfum intemporel et affirmé, qui mêle la chaleur épicée de la cannelle à une base boisée et fruitée, dominée par la pomme et le cèdre noble. Le cœur floral légèrement corsé s’équilibre avec la douceur vanillée et boisée du fond, pour une signature élégante, dynamique et rassurante.","n":""},"232":{"f":"Orientale boisée","t":"Mandarine, Estragon, Romarin, Basilic","h":"Anis, Néroli, Géranium, Muguet","d":"Vanille, Amande, Fève de tonka, Benjoin, Cèdre","x":"Une fragrance chaleureuse et cérébrale, à la fois suave et affirmée, qui mêle la douceur de l’amande et de la vanille à des accords aromatiques et floraux raffinés. Le fond boisé, enveloppé de fève tonka et de benzoïne, crée une signature intellectuelle, mystérieuse et captivante.","n":""},"234":{"f":"Fougère aromatique","t":"Aldéhydes, Coriandre, Sauge sclarée, Armoise, Bergamote","h":"Patchouli, Œillet, Vétiver, Jasmin, Géranium, Racine d’iris, Cannelle, Lavande","d":"Civette, Musc, Miel, Cuir, Mousse de chêne, Ambre, Fève de tonka, Vanille","x":"Une fragrance mythique et virile, construite autour d’un départ aromatique puissant et légèrement métallisé. Le cœur épicé et floral, enrichi de sauge et d’iris, s’imprègne d’un fond animal, cuiré et résineux, typique des grandes signatures masculines des années 80. Un parfum au caractère affirmé, pour les hommes sûrs de leur force.","n":""},"236":{"f":"Boisée épicée","t":"Citron, Gingembre, Lavande, Menthe","h":"Pomme, Cardamome du Guatémala, Genévrier, Géranium","d":"Fève de tonka, Amberwood, Vétiver de Haïti","x":"Une fragrance pétillante et charismatique, qui démarre sur une fraîcheur fruitée et épicée grâce au cédrat et au gingembre, vite relayée par un cœur aromatique et masculin porté par la lavande et le genévrier. Le fond dévoile un sillage chaud et moderne, dominé par l’amberwood, la fève tonka et le vétiver. Une signature intense et séductrice, pensée pour l’homme audacieux.","n":""},"238":{"f":"Boisée aromatique","t":"Aldéhydes, Bergamote, Gingembre","h":"Lavande, Sauge sclarée, Géranium","d":"Ambre Gris, Cèdre, Vanille, Résine Oliban","x":"Un parfum moderne et structuré, au départ tonique et lumineux dominé par des agrumes, des fruits croquants et des touches aromatiques vertes. Le cœur frais et légèrement aromatique précède un fond boisé-musqué aux accents ambrés et fumés, apportant de la profondeur et de la tenue. Une fragrance pour un homme affirmé, créatif et ambitieux.","n":""},"239":{"f":"Aromatique épicée","t":"Gingembre, Pamplemousse, Thym, Bergamote, Accord vert","h":"Vanille, Liqueur, Cannelle, Cuir, Pomme","d":"Myrrhe, Sucre, Notes boisées, Cèdre, Bois de cachemire, Patchouli","x":"Un parfum audacieux et séducteur, qui conjugue la fraîcheur fusante du pamplemousse et du gingembre à un cœur épicé et liquoreux, presque enivrant. Le fond, riche et sensuel, dévoile une vanille suave, mêlée à des notes boisées, cuirées et ambrées, pour un sillage charismatique et intense. Parfum · 20 % d'essence de parfum · 75 ml & recharge 125 ml · 11 parfums","n":""},"300":{"f":"Cuir boisé","t":"Framboise, Cannelle, Bergamote","h":"Racine d’iris, Cèdre, Osmanthus","d":"Cuir, Oud, Vanille, Patchouli","x":"Un parfum intense, élégant et mystérieux, mêlant fruits pétillants, épices chaleureuses, fleurs délicates et bois précieux, enveloppés d’un fond de cuir, d’oud et de vanille, pour une femme audacieuse, sophistiquée et magnétique.","n":""},"301":{"f":"Floral fruité","t":"Cerise, Poivre Rose","h":"Rose de Bulgarie, Rose de Turquie","d":"Fruits rouges","x":"Un parfum pétillant, romantique et délicatement fruité, mêlant la gourmandise de la cerise à la fraîcheur du poivre rose et à l’élégance de roses précieuses, sur un fond de fruits rouges, pour une femme féminine, séduisante et pleine de charme.","n":""},"302":{"f":"Oriental épicé","t":"Cannelle, Cardamome","h":"Notes épicées","d":"Ambre, Musc","x":"Un parfum chaleureux, épicé et sensuel, mêlant la cannelle et la cardamome à un cœur intensément épicé, enveloppé par la douceur ambrée et musquée du fond, pour une femme élégante, mystérieuse et captivante.","n":""},"303":{"f":"Oriental vanillé","t":"Poudre de Coco, Héliotrope","h":"Vanille de Madagascar","d":"Absolu de vanille, Musc blanc, Musc Palo Santo, Noix de Coco, Lactones","x":"Un parfum doux, crémeux et enveloppant, mêlant la délicatesse de la noix de coco et de l’héliotrope à une vanille généreuse et gourmande, sur un fond de muscs blancs, de bois de palo santo et de notes lactées, pour une femme douce, solaire et irrésistiblement réconfortante.","n":""},"304":{"f":"Hespéridé aromatique","t":"Pamplemousse","h":"Gingembre, Ambrette","d":"Ambroxan, Musc, Vétiver, Patchouli","x":"Un parfum frais, vibrant et élégant, mêlant l’éclat pétillant du pamplemousse à la chaleur du gingembre et à la douceur délicate de l’ambrette, sur un fond boisé et musqué de vétiver, patchouli et ambre, pour une femme moderne, raffinée et pleine d’assurance.","n":""},"226A":{"f":"Cuirée","t":"Cannabis, Pamplemousse","h":"Poivre noir, Géranium","d":"Cuir, Vétiver","x":"Un parfum rebelle et contrasté, qui mêle la fraîcheur zestée du pamplemousse et le piquant du poivre, à la verdeur aromatique du géranium. Le fond cuiré et boisé impose une empreinte urbaine, provocante et intensément masculine.","n":""},"227A":{"f":"Boisée aromatique","t":"Encens, Cuir","h":"Patchouli, Myrrhe","d":"Cèdre, Davana","x":"Plongez dans la profondeur envoûtante de Noir Absolu, une fragrance puissante et mystérieuse où la davana ouvre le parfum sur une touche ambrée et liquoreuse. En fond, la richesse du patchouli, la myrrhe et l’encens s’entrelacent pour créer une aura sensuelle et hypnotique, soutenue par des nuances de cuir et de bois de cèdre.","n":""},"231A":{"f":"Fougère aromatique","t":"Châtaigne, Sucre","h":"Sauge, Lavande","d":"Vanille, Fumée","x":"Une fragrance moderne et sensuelle, où la fraîcheur fruitée et aromatique s’associe à un cœur chaleureux et réconfortant de châtaigne et d’épices douces. Le fond, boisé et vanillé, laisse une empreinte addictive et enveloppante, signature d’un homme tendre, affirmé et résolument charismatique.","n":""},"233A":{"f":"Boisée aromatique","t":"Lavande, Zeste de citron, Limone Costa d’Amalfi","h":"Lavande, Notes terreuses, Pomme, Fumée, Patchouli","d":"Vanille, Lavande, Vétiver","x":"Une fragrance avant-gardiste et texturée, qui juxtapose la fraîcheur pétillante des agrumes à un cœur inattendu de lavande fumée, pour mieux s’ancrer dans un fond crémeux, terreux et vibrant, où la vanille et le vétiver signent un sillage futuriste et viril. Une essence pour les hommes en quête d’identité audacieuse et ultra-moderne.","n":""},"235A":{"f":"Boisée aromatique","t":"Bergamote","h":"Noix de coco","d":"Fève Tonka","x":"Une fragrance à la fraîcheur solaire, portée par une bergamote vive, adoucie par un cœur lacté et exotique de noix de coco, et réchauffée par une base sensuelle de fève tonka. Ce parfum offre un sillage à la fois hédoniste, lumineux et terriblement addictif, symbole d’une virilité assumée et séduisante.","n":""},"237A":{"f":"Orientale boisée","t":"Mandarine, Sauge sclarée","h":"Caramel, fève de tonka","d":"Vétiver","x":"Une fragrance puissante et irrésistible, où la mandarine juteuse explose en tête avant de laisser place à un cœur aromatique et moderne de sauge. Le fond dévoile une signature gourmande et boisée, dominée par un caramel fondant, une fève tonka suave et un vétiver viril. Un parfum pour les hommes charmeurs, sûrs d’eux, et terriblement séduisants.","n":""},"145P":{"f":"Orientale floral","t":"Calypsone, Bergamote, Fruits rouges","h":"Lys, Ylang-ylang, Jasmin","d":"Meringue, Musc, Patchouli","x":"La fraîcheur de l’eau de mer et des baies rouges s’entrelace à un cœur gourmand de meringue et de fleurs blanches, sublimé par un fond musqué raffiné. Une fragrance élégante et envoûtante, à la fois douce et sophistiquée.","n":""},"148P":{"f":"Orientale floral","t":"","h":"","d":"","x":"Laissez-vous envoûter par cette fragrance lumineuse et raffinée où la fleur d’oranger dévoile toute sa douceur en note de cœur. Son sillage s’ancre dans la sensualité d’un ambre chaud et enveloppant, subtilement relevé par des notes boisées qui lui confèrent profondeur et caractère. Un parfum délicatement équilibré entre l’éclat du floral et la chaleur ambrée, symbole d’élégance intemporelle et de féminité lumineuse.","n":"Fleur d’oranger, Ambre, Notes boisées"},"160P":{"f":"Aromatique","t":"Vanille, Lavande, Cacao, Gingembre","h":"Caviar de Vanille","d":"Absolu de vanille","x":"La fraîcheur aromatique de la lavande s’ouvre sur un cœur onctueux de vanille chaleureuse, enveloppé par la profondeur boisée et sensuelle du patchouli. Une fragrance noble et captivante, alliant puissance, douceur et raffinement.","n":""},"161P":{"f":"Orientale floral","t":"Litchi, Gingembre, Bergamote","h":"Pivoine, Rose de Turquie, Cacao","d":"Patchouli","x":"Un parfum aérien et poétique, qui s’ouvre sur une note pétillante de litchi et bergamote, relevée d’un soupçon de gingembre frais. Le cœur dévoile un duo floral tendre et lumineux, entre rose et pivoine, tandis que le fond s’enveloppe d’un accord gourmand et chaud de cacao et patchouli. Une fragrance enchanteresse, rêveuse et résolument moderne.","n":""},"170P":{"f":"Floral fruitée gourmand","t":"Framboise, Liqueur, Bergamote de Calabre","h":"Feuille de violette, Rose","d":"Cuir, Beurre de cacao, Cèdre","x":"Un parfum chaleureux et intensément féminin, où la framboise juteuse rencontre la feuille de violette fraîche et un soupçon de bergamote lumineuse. Le cœur dévoile une rose liquoreuse enveloppée de douceur, sur un fond sensuel et profond, marqué par des accords de cuir délicat et de bois nobles.","n":""},"217P":{"f":"Orientale floral","t":"Amande amère, Safran","h":"Jasmin d’Egypte, Cèdre de Virginie","d":"Ambre gris, Notes boisées, Musc, Ambroxan, Bois de cachemire","x":"Une fragrance lumineuse et envoûtante, construite autour d’un accord boisé, ambré et musqué d’une grande intensité. Le duo safran-amande, à la fois chaleureux et aérien, introduit un cœur floral élégant et discret, dominé par le jasmin. Le fond, dominé par l’ambre gris, le cèdre et l’ambroxan, crée un sillage abstrait et vibrant, à la fois minéral, addictif et mystérieusement magnétique.","n":""},"220P":{"f":"Orientale fougère","t":"Lavande, Menthe","h":"Vanille, Benjoin","d":"Miel, Fève de tonka, Tabac","x":"Une fragrance opulente et envoûtante, qui débute par une fraîcheur mentholée revigorante, bientôt réchauffée par une lavande sensuelle. Le fond dévoile une signature suave et puissante, mêlant miel, tabac et vanille, pour un sillage hautement addictif et masculin. Une essence pensée pour les hommes sûrs d’eux, charismatiques et élégamment provocateurs.","n":""},"222P":{"f":"Orientale épicée","t":"Pamplemousse, Bergamote, Gingembre","h":"Romarin, Sauge, Notes aquatiques, Géranium","d":"Ambroxan, Ambre, Ciste","x":"L’éclat vif du pamplemousse et de la bergamote s’accorde aux notes aquatiques et au piquant du gingembre, relevés par la fraîcheur aromatique du romarin. Le cœur dévoile une alliance élégante de sauge et de géranium, avant de s’épanouir sur un fond puissant d’ambroxan, de ciste et d’ambre.","n":""},"223P":{"f":"Boisée chyprée","t":"Iris, Cyprès, Baies de genévrier","h":"Myrrhe, Patchouli","d":"Notes boisées, Miel, Vanille, Ambre, Résines, Musc, Cuir","x":"Un parfum élégant et raffiné, où les baies de genévrier fraîches ouvrent sur un cœur poudré et boisé, sublimé par l’iris noble et le cyprès fusant. Le fond, riche en myrrhe, miel, ambre et vanille, laisse un sillage sensuel, mystérieux et enveloppant. Une fragrance lumineuse et spirituelle, d’une rare distinction.","n":""},"228P":{"f":"Orientale vanillée","t":"Lavande, Menthe, Bergamote","h":"Griotte, Freesia, Jasmin","d":"Fêve de tonka, Vanille, Cosse de cacao, Caramel, Praliné, Lait, Benjoin, Bois de Santal, Cuir, Cèdre","x":"Une fragrance ultra-gourmande et raffinée, qui marie la fraîcheur vive de la griotte et de la menthe à un cœur lacté et floral. Le fond, opulent, est une véritable caresse sucrée aux accords de fève tonka, caramel, praliné et cacao, sur un lit boisé et cuiré. Un parfum luxueux, addictif et intensément sensuel.","n":""},"232P":{"f":"Aromatique","t":"Noix de muscade, Cannelle, Cardamome, Pamplemousse","h":"Lavande","d":"Réglisse, Bois de Santal, Ambre, Patchouli, Vétiver de Haïti","x":"Un parfum intense et contrasté, mêlant la fraîcheur vibrante du pamplemousse et la chaleur aromatique des épices. Le cœur mêle lavande et réglisse, dans une tension maîtrisée entre douceur et caractère. Le fond, boisé et ambré, ancre la fragrance dans un sillage profond et magnétique, pour un homme à l’élégance instinctive et contemporaine. Parfum · 25 à 30 % de concentration · 75 ml & recharge 125 ml · 5 parfums","n":""},"146A":{"f":"Floral boisée musquée","t":"Mangue, Bergamote","h":"Jasmin, Résine Oliban","d":"Vanille, Bois de Santal","x":"Une fragrance fruitée solaire et boisée, construite autour d’un accord de mangue lumineuse et de jasmin éclatant, posés sur un fond crémeux et sensuel de vanille, bois de santal et encens doux. Ce parfum incarne une femme moderne, libre et magnétique, à la fois rayonnante et enveloppante, entre douceur et audace.","n":""},"149A":{"f":"Orientale floral","t":"Poire,Tangerine, Bergamote","h":"Fleur d’oranger, Essence de néroli, Néroli, Jasmin Sambac","d":"Vanille bourbon, Ambre, Musc Blanc, Benjoin","x":"Une fragrance lumineuse et féminine, portée par une envolée d’agrumes doux et de poire juteuse, qui s’ouvre sur un cœur floral blanc, solaire et élégant. Le fond s’installe en douceur avec des accords de vanille, musc et ambre, enrichis de benzoïne pour un effet soyeux et enveloppant. Elle incarne une femme libre et sophistiquée, en quête d’équilibre entre force et douceur.","n":""},"151A":{"f":"Orientale floral","t":"Cassis, Poivre rose, Bergamote","h":"Jasmin, Jasmin Sambac, Thé au jasmin","d":"Vanille bourbon, Bois de cachemire, Gaïac","x":"Un parfum floral et lumineux, qui s’ouvre sur un cassis juteux et pétillant, relevé de poivre rose et de bergamote. Le cœur célèbre le jasmin sous toutes ses facettes, du jasmin sambac au thé au jasmin, pour une élégance délicate et rayonnante. Le fond, chaud et velouté, associe la vanille bourbon au bois de cachemire et au gaïac. Une fragrance raffinée et sensuelle, pour une femme moderne et sûre d’elle.","n":""},"152A":{"f":"Floral fruitée","t":"Poire, Ambrette","h":"Rose, Iris","d":"Musc, Cèdre de Virginie","x":"Une fragrance rayonnante et joyeuse, dominée par un duo fruité de poire juteuse et framboise sucrée, qui s’épanouit dans un cœur rose et musqué, aérien et lumineux. Le fond, à base de bois blonds et d’ambre doux, apporte une élégance délicate et contemporaine. Une ode à la spontanéité et à la féminité moderne.","n":""},"154A":{"f":"Orientale floral","t":"Amande, Café, Bergamote, Citron","h":"Tubéreuse, Jasmin Sambac, Fleur d’oranger, Rose de Bulgarie, Racine d’iris","d":"Fève de tonka, Cacao, Vanille, Praliné, Bois de Santal, Musc, Ambre, Bois de cachemire, Patchouli, Cannelle, Cèdre","x":"Une fragrance gourmande et affirmée, où l’amande et les agrumes ouvrent un sillage lumineux et captivant. Le cœur, floral et corsé, mêle tubéreuse, café et jasmin, créant un contraste riche et audacieux. En fond, la vanille, le praliné et les bois sensuels enveloppent la peau dans une empreinte chaleureuse, séduisante et résolument moderne.","n":""},"156A":{"f":"Orientale floral","t":"Fleur de Gingembre, Fleur d’oranger, Poivre rose, Grenade","h":"Confiture de lait, Datura","d":"Fève de tonka, Patchouli, Vétiver de Haïti","x":"Un parfum audacieux et séduisant, construit autour d’un contraste gourmand et épicé. L’ouverture pétillante de grenade et d’épices chaudes se mêle à un cœur crémeux et floral, dominé par la fleur d’oranger et la datura, sur une base orientale et sensuelle de fève tonka, vétiver et patchouli. Une fragrance pour une femme magnétique, affirmée et irrésistible.","n":""},"159A":{"f":"Floral","t":"Fleur d’oranger, Bergamote","h":"Tubéreuse, Jasmin d’Inde","d":"Vanille de Madagascar, Musc Blanc, Cèdre de Virginie","x":"Une fragrance lumineuse et généreuse, dominée par un bouquet de fleurs blanches éclatantes, porté par la tubéreuse et le jasmin. L’ouverture vive à la bergamote introduit une fraîcheur subtile, adoucie par un fond crémeux et doux de vanille, musc et bois de cèdre. Une signature délicate et enveloppante pour une femme ouverte sur le monde et profondément elle-même.","n":""},"160A":{"f":"Floral fruitée","t":"Framboise, Citron, Néroli","h":"Rose","d":"Vanille, Musc, Amberwood","x":"Une fragrance fraîche, douce et romantique, qui s’ouvre sur une envolée de framboise acidulée et de cédrat pétillant, équilibrée par la délicatesse du néroli. En son cœur, une rose lumineuse et féminine dévoile toute sa tendresse, avant de se fondre dans un fond vanillé et musqué, réchauffé par une touche boisée moderne. Un parfum pour une femme amoureuse, solaire et spontanée.","n":""},"162A":{"f":"Orientale floral","t":"Framboise, Litchi","h":"Rose de Damas","d":"Bois d’Akigala, Benjoin","x":"Un parfum éclatant et magnétique, construit autour d’un duo fruité de framboise acidulée et litchi juteux. Le cœur dévoile une rose lumineuse et moderne, presque vibrante. En fond, l’akigalawood et la benzoïne viennent apporter profondeur boisée et chaleur orientale, pour une signature à la fois addictive, audacieuse et ultra contemporaine.","n":""},"163A":{"f":"Orientale vanillée","t":"Poire","h":"Fève de tonka, Jasmin","d":"Vanille","x":"Une fragrance gourmande et séductrice, qui s’ouvre sur une poire juteuse et veloutée, rapidement enveloppée d’un cœur floral lumineux au jasmin. En fond, un duo envoûtant de vanille addictive et fève tonka suave laisse un sillage crémeux et sensuel, parfaitement incarné par une féminité affirmée et magnétique.","n":""},"174A":{"f":"Floral fruitée gourmand","t":"Noix de coco, Bergamote","h":"Jasmin Sambac, Fleur d’Oranger","d":"Vanille bourbon, Patchouli","x":"Un parfum chaleureux et lumineux, qui évoque un rayon de soleil sur la peau. L’ouverture fraîche de bergamote laisse rapidement place à un cœur radieux, dominé par une fleur d’oranger solaire et un jasmin soyeux. Le fond déploie toute sa sensualité autour d’une noix de coco veloutée, réchauffée de vanille douce et soulignée par une touche de patchouli discret.","n":""}};
var BONHTML="\n          <b id=\"bn-titre\">Bon de commande<\/b>\n          <small>Remplissez le bon avec votre client(e), puis enregistrez la vente : elle apparaît dans « Espace administrateur ». La date, le prénom, le nom, et l'e-mail ou le téléphone du client(e) sont obligatoires.<\/small>\n          <div id=\"bn-memo\" hidden style=\"margin-top:10px;padding:10px 12px;background:#FAF3E6;border:1px solid rgba(201,169,110,.5);border-radius:var(--r-sm);font-size:13px;line-height:1.6;white-space:pre-line\"><\/div>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\"><div style=\"flex:1;min-width:170px\"><label for=\"bn-date\" style=\"display:block;margin-top:12px;font-size:14px;font-weight:700\">Date de la vente (obligatoire)<\/label><input id=\"bn-date\" type=\"text\" placeholder=\"19/11/2026 ou 19/11/2026 14:30\" autocomplete=\"off\" style=\"width:100%;margin-top:6px;padding:10px;border:1.5px solid var(--dore);border-radius:var(--r-sm);font-size:16px;font-family:inherit;background:#fff\"/><small style=\"display:block;margin-top:4px;font-size:12px;color:var(--gris)\">La date seule suffit ; l'heure est facultative.<\/small><\/div><div style=\"flex:1;min-width:170px\"><label for=\"bn-lieu\" style=\"display:block;margin-top:12px;font-size:14px;font-weight:700\">Lieu de la vente (facultatif)<\/label><input id=\"bn-lieu\" type=\"text\" maxlength=\"100\" placeholder=\"Ex. : marché de Noël, à domicile\" autocomplete=\"off\" style=\"width:100%;margin-top:6px;padding:10px;border:1.5px solid var(--dore);border-radius:var(--r-sm);font-size:16px;font-family:inherit;background:#fff\"/><\/div><\/div>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\"><div style=\"flex:1;min-width:140px\"><label for=\"bn-p\" style=\"display:block;margin-top:12px;font-size:14px;font-weight:700\">Prénom du client(e) (obligatoire)<\/label><input id=\"bn-p\" type=\"text\" autocomplete=\"off\" style=\"width:100%;margin-top:6px;padding:10px;border:1.5px solid var(--dore);border-radius:var(--r-sm);font-size:16px;font-family:inherit;background:#fff\"/><\/div><div style=\"flex:1;min-width:140px\"><label for=\"bn-n\" style=\"display:block;margin-top:12px;font-size:14px;font-weight:700\">Nom du client(e) (obligatoire)<\/label><input id=\"bn-n\" type=\"text\" autocomplete=\"off\" style=\"width:100%;margin-top:6px;padding:10px;border:1.5px solid var(--dore);border-radius:var(--r-sm);font-size:16px;font-family:inherit;background:#fff\"/><\/div><\/div>\n          <label for=\"bn-d\" style=\"display:block;margin-top:12px;font-size:14px;font-weight:700\">Date de naissance (facultatif)<\/label><small style=\"display:block;margin-top:4px;font-size:12px;color:var(--gris)\">Elle permet de lui offrir un petit cadeau le jour de l'anniversaire de votre client(e).<\/small><input id=\"bn-d\" type=\"text\" inputmode=\"numeric\" placeholder=\"05/03/1980\" autocomplete=\"off\" style=\"width:100%;margin-top:6px;padding:10px;border:1.5px solid var(--dore);border-radius:var(--r-sm);font-size:16px;font-family:inherit;background:#fff\"/>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\"><div style=\"flex:1;min-width:160px\"><label for=\"bn-e\" style=\"display:block;margin-top:12px;font-size:14px;font-weight:700\">E-mail (ou téléphone)<\/label><input id=\"bn-e\" type=\"email\" autocomplete=\"off\" style=\"width:100%;margin-top:6px;padding:10px;border:1.5px solid var(--dore);border-radius:var(--r-sm);font-size:16px;font-family:inherit;background:#fff\"/><\/div><div style=\"flex:1;min-width:160px\"><label for=\"bn-t\" style=\"display:block;margin-top:12px;font-size:14px;font-weight:700\">Téléphone (ou e-mail)<\/label><input id=\"bn-t\" type=\"tel\" autocomplete=\"off\" style=\"width:100%;margin-top:6px;padding:10px;border:1.5px solid var(--dore);border-radius:var(--r-sm);font-size:16px;font-family:inherit;background:#fff\"/><\/div><\/div>\n          <label for=\"bn-ad\" style=\"display:block;margin-top:12px;font-size:14px;font-weight:700\">Adresse du client(e) (facultatif)<\/label><input id=\"bn-ad\" type=\"text\" maxlength=\"120\" autocomplete=\"off\" style=\"width:100%;margin-top:6px;padding:10px;border:1.5px solid var(--dore);border-radius:var(--r-sm);font-size:16px;font-family:inherit;background:#fff\"/><label for=\"bn-ad2\" style=\"display:block;margin-top:12px;font-size:14px;font-weight:700\">Complément d'adresse (facultatif)<\/label><input id=\"bn-ad2\" type=\"text\" maxlength=\"120\" autocomplete=\"off\" style=\"width:100%;margin-top:6px;padding:10px;border:1.5px solid var(--dore);border-radius:var(--r-sm);font-size:16px;font-family:inherit;background:#fff\"/><div style=\"display:flex;gap:8px;flex-wrap:wrap\"><div style=\"flex:1;min-width:120px\"><label for=\"bn-cpa\" style=\"display:block;margin-top:12px;font-size:14px;font-weight:700\">Code postal<\/label><input id=\"bn-cpa\" type=\"text\" inputmode=\"numeric\" maxlength=\"10\" autocomplete=\"off\" style=\"width:100%;margin-top:6px;padding:10px;border:1.5px solid var(--dore);border-radius:var(--r-sm);font-size:16px;font-family:inherit;background:#fff\"/><\/div><div style=\"flex:2;min-width:160px\"><label for=\"bn-vl\" style=\"display:block;margin-top:12px;font-size:14px;font-weight:700\">Ville<\/label><input id=\"bn-vl\" type=\"text\" maxlength=\"60\" autocomplete=\"off\" style=\"width:100%;margin-top:6px;padding:10px;border:1.5px solid var(--dore);border-radius:var(--r-sm);font-size:16px;font-family:inherit;background:#fff\"/><\/div><\/div>\n          <p style=\"display:block;margin-top:12px;font-size:14px;font-weight:700\">Articles<\/p>\n          <div id=\"bn-lignes\"><\/div>\n          <button id=\"bn-add\" type=\"button\" style=\"background:#fff;border:1.5px solid var(--dore);color:var(--brun);border-radius:20px;padding:9px 16px;font-size:14px;cursor:pointer;font-family:inherit;margin-top:8px\">+ Ajouter un article<\/button>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\"><div style=\"flex:1;min-width:200px\"><label for=\"bn-o\" style=\"display:block;margin-top:12px;font-size:14px;font-weight:700\">Remise ou offre appliquée<\/label><select id=\"bn-o\" style=\"width:100%;margin-top:6px;padding:10px;border:1.5px solid var(--dore);border-radius:var(--r-sm);font-size:16px;font-family:inherit;background:#fff\"><option value=\"Aucune\">Aucune<\/option><option value=\"Remise personnelle\">Remise personnelle<\/option><option value=\"Offre EXHALESSENCE\">Offre EXHALESSENCE<\/option><option value=\"Mes offres\">Mes offres<\/option><\/select><small style=\"display:block;margin-top:4px;font-size:12px;color:var(--gris)\">Pour une remise décidée par vous : choisissez « Remise personnelle », puis % ou € ; le total se calcule tout seul.<\/small><\/div><\/div>\n          <div id=\"bn-red\" style=\"display:none;gap:8px;flex-wrap:wrap\"><div style=\"width:110px\"><label for=\"bn-rt\" style=\"display:block;margin-top:12px;font-size:14px;font-weight:700\">Remise en<\/label><select id=\"bn-rt\" style=\"width:100%;margin-top:6px;padding:10px;border:1.5px solid var(--dore);border-radius:var(--r-sm);font-size:16px;font-family:inherit;background:#fff\"><option value=\"%\">%<\/option><option value=\"€\">€<\/option><\/select><\/div><div style=\"flex:1;min-width:120px\"><label for=\"bn-rv\" style=\"display:block;margin-top:12px;font-size:14px;font-weight:700\">Valeur de la remise<\/label><input id=\"bn-rv\" type=\"text\" inputmode=\"decimal\" placeholder=\"10\" autocomplete=\"off\" style=\"width:100%;margin-top:6px;padding:10px;border:1.5px solid var(--dore);border-radius:var(--r-sm);font-size:16px;font-family:inherit;background:#fff\"/><\/div><\/div>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\"><div style=\"flex:1;min-width:160px\"><label for=\"bn-r\" style=\"display:block;margin-top:12px;font-size:14px;font-weight:700\">Règlement<\/label><select id=\"bn-r\" style=\"width:100%;margin-top:6px;padding:10px;border:1.5px solid var(--dore);border-radius:var(--r-sm);font-size:16px;font-family:inherit;background:#fff\"><option>Espèces<\/option><option>Carte bancaire<\/option><option>Wero<\/option><option>PayPal<\/option><option>Virement<\/option><option>Autre<\/option><\/select><\/div><div style=\"flex:1;min-width:160px\"><label for=\"bn-l\" style=\"display:block;margin-top:12px;font-size:14px;font-weight:700\">Livraison<\/label><select id=\"bn-l\" style=\"width:100%;margin-top:6px;padding:10px;border:1.5px solid var(--dore);border-radius:var(--r-sm);font-size:16px;font-family:inherit;background:#fff\"><option value=\"Remis sur place\">Remis sur place (en main propre)<\/option><option value=\"Chronopost relais\">Envoyé en Chronopost relais<\/option><\/select><\/div><\/div>\n          <div id=\"bn-rel\" style=\"display:none\"><small style=\"display:block;margin-top:4px;font-size:12px;color:var(--gris)\">Pour chercher les points relais, le code postal et la ville de l'adresse ci-dessus sont utilisés.<\/small><div style=\"margin-top:6px\"><button id=\"bn-map\" type=\"button\" style=\"background:#fff;border:1.5px solid var(--dore);color:var(--brun);border-radius:20px;padding:9px 16px;font-size:14px;cursor:pointer;font-family:inherit\">Voir les points relais sur la carte<\/button><\/div><label for=\"bn-relais\" style=\"display:block;margin-top:12px;font-size:14px;font-weight:700\">Point relais choisi (nom et adresse)<\/label><input id=\"bn-relais\" type=\"text\" maxlength=\"150\" autocomplete=\"off\" style=\"width:100%;margin-top:6px;padding:10px;border:1.5px solid var(--dore);border-radius:var(--r-sm);font-size:16px;font-family:inherit;background:#fff\"/><\/div>\n          <label for=\"bn-ppe\" style=\"display:block;margin-top:12px;font-size:14px;font-weight:700\">Points de fidélité : points gagnés par euro dépensé (facultatif)<\/label><input id=\"bn-ppe\" type=\"text\" inputmode=\"decimal\" placeholder=\"Ex. : 1 pour 1 point par euro\" autocomplete=\"off\" style=\"width:100%;margin-top:6px;padding:10px;border:1.5px solid var(--dore);border-radius:var(--r-sm);font-size:16px;font-family:in function norm(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim()}

/* météo + lieu (seulement si le téléphone l'autorise) */
var WMO=function(c){if(c===0)return["☀️","ciel dégagé"];if(c<=2)return["🌤️","peu nuageux"];if(c===3)return["☁️","couvert"];if(c===45||c===48)return["🌫️","brouillard"];if(c>=51&&c<=57)return["🌦️","bruine"];if(c>=61&&c<=67)return["🌧️","pluie"];if(c>=71&&c<=77)return["❄️","neige"];if(c>=80&&c<=82)return["🌦️","averses"];if(c>=95)return["⛈️","orage"];return["🌡️",""]};
function lieuMeteo(demande){
  var m=$("h-meteo"),b=$("h-loc");
  if(!navigator.geolocation){m.textContent="";b.hidden=true;return}
  function lance(){
    navigator.geolocation.getCurrentPosition(function(p){
      var la=p.coords.latitude,lo=p.coords.longitude;b.hidden=true;
      var q1=fetch("https://api.open-meteo.com/v1/forecast?latitude="+la+"&longitude="+lo+"&current=temperature_2m,weather_code&timezone=auto").then(function(r){if(!r.ok)throw new Error("meteo");return r.json()});
      var q2=fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude="+la+"&longitude="+lo+"&localityLanguage=fr").then(function(r){return r.json()}).catch(function(){return {}});
      Promise.all([q1,q2]).then(function(a){
        var cur=a[0]&&a[0].current,ville=a[1]&&(a[1].city||a[1].locality)||"";
        if(!cur){m.textContent=ville?"📍 "+ville:"";return}
        var w=WMO(cur.weather_code);
        m.textContent=w[0]+" "+Math.round(cur.temperature_2m)+" °C"+(w[1]?" · "+w[1]:"")+(ville?" · 📍 "+ville:"");
      }).catch(function(){m.textContent="La météo n'a pas pu se charger.";b.hidden=false;b.textContent="Réessayer la météo"});
    },function(err){
      m.textContent="";b.hidden=false;
      b.textContent=err&&err.code===1&&demande?"Localisation refusée : autorisez-la dans les réglages du navigateur, puis touchez ici":"Afficher la météo et ma ville";
    },{timeout:12000,maximumAge:600000});
  }
  if(navigator.permissions&&navigator.permissions.query){
    navigator.permissions.query({name:"geolocation"}).then(function(s){
      if(s.state==="granted"||demande)lance();
      else if(s.state==="denied"){m.textContent="";b.hidden=false;b.textContent="Afficher la météo et ma ville"}
      else{m.textContent="";b.hidden=false}
    }).catch(function(){if(demande)lance();else b.hidden=false});
  }else{if(demande)lance();else b.hidden=false}
}

function chargeVentes(cb,forcer){
  if(ventes&&!forcer)return cb(null,ventes);
  post("/equipe/ventes",{}).then(function(r){
    if(r._s===401){verrouille("Session expirée : entrez à nouveau votre mot de passe.");return}
    if(!r.ok)return cb(r.erreur||"Impossible de charger vos ventes. Réessayez.");
    ventes=r.ventes||[];cb(null,ventes);
  }).catch(function(){cb("Pas de connexion : réessayez dans un instant.")});
}
function jolie(iso){try{return new Date(iso).toLocaleDateString("fr-FR",{timeZone:Z,day:"2-digit",month:"2-digit",year:"numeric"})}catch(e){return ""}}
function clients(){
  var map={},ordre=[];
  (ventes||[]).forEach(function(v){
    if(v.statut==="Annulée")return;
    var cle=(v.mail||"").toLowerCase()||String(v.tel||"").replace(/\D/g,"")||norm(v.prenom+" "+v.nom);
    var c=map[cle];
    if(!c){c=map[cle]={prenom:v.prenom,nom:v.nom,mail:v.mail,tel:v.tel,naissance:v.naissance,n:0,total:0,derniere:v.date,info:""};ordre.push(c)}
    if(v.lieu==="Fiche client"){c.info=v.note||c.info}else{c.n++;c.total+=Number(v.total)||0}
    if(!c.naissance&&v.naissance)c.naissance=v.naissance;
    if(!c.tel&&v.tel)c.tel=v.tel;if(!c.mail&&v.mail)c.mail=v.mail;
    if(v.date>c.derniere)c.derniere=v.date;
  });
  ordre.sort(function(a,b){return a.derniere<b.derniere?1:-1});
  return ordre;
}
function chargement(el,suite){
  el.innerHTML='<p class="vide">Chargement…</p>';
  chargeVentes(function(err,v){if(err){el.innerHTML='<p class="vide">'+esc(err)+'</p>';return}suite(v)});
}
function actionsContact(c,texteSms){

}

/* Anniversaires */
function prochainAnniv(naiss){
  var m=String(naiss||"").match(/^(\d{1,2})[\/\-. ](\d{1,2})[\/\-. ](\d{4})$/);if(!m)return null;
  var j=+m[1],mo=+m[2],an=+m[3];if(j<1||j>31||mo<1||mo>12)return null;
  var nowP=new Date(new Date().toLocaleString("en-US",{timeZone:Z}));
  var auj=new Date(nowP.getFullYear(),nowP.getMonth(),nowP.getDate());
  var d=new Date(auj.getFullYear(),mo-1,j);
  if(d<auj)d=new Date(auj.getFullYear()+1,mo-1,j);
  return {jours:Math.round((d-auj)/864e5),date:d,age:d.getFullYear()-an};
}
VUES.anniv=function(el){

  chargement($("a-z"),function(){
